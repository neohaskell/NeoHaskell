formula = "change"
description = "Change process v2 (ADR-0075): one molecule, request to merged PR, 5 coarse steps. Speed-first rebuild of the retired 20-step formula: spec approval is the only unconditional human gate; verify is an independent opus verdict (V1-V9) that, together with green CI, authorizes auto-merge for non-breaking changes. Security/perf review downscoped from heavyweight design-review stages to the cheap concrete V9 sanity pass (ADR-0075, reversible). Input: a request. Output: a merged PR. Stage playbook: .claude/skills/neohaskell-change/SKILL.md."

[vars.request]
description = "The request this change is for: issue#NNN, adhoc:<slug>, or a one-line ask from Nick."
required = true

[[steps]]
id = "spec"
title = "Spec"
description = "Opus, one pass, 45m time-box. (1) Restate the request in contract terms; if an ambiguity would change the contract, ask exactly ONE clarifying question now and block on it; cosmetic ambiguity is resolved silently and noted on the bead. (2) Localize, BINDING: write the touches:/files:/uses: lists to the bead; downstream steps never re-derive them; reality contradicting them later parks the run as wrong-localization. (3) Spec: copy docs/changes/TEMPLATE.md to NNN-slug.md — contract delta in signatures vocabulary; criteria C1..Cn each naming its proving test AND level (unit|integration|acceptance; property-based qualifier where the contract is algebraic); edge cases and failure modes enumerated, INCLUDING concurrency-sensitive behavior where the contract involves shared state or parallelism (those criteria must name a concurrency stress test) and security-relevant boundaries (external input crossing a trust boundary names its validation criterion); the breaking: flag honest (it decides the merge path in the pr step); ADR written iff triggered. kind: bug -> C1 is the failing repro test committed RED. (4) Push the branch and open the draft PR whose diff is the spec (+ADR, +red repro). Done when ./dev spec-check passes and the draft PR exists."
depends_on = []

[[steps]]
id = "spec-approval"
title = "Spec approval (GATE 1 - Nick + Fable)"
description = "The only unconditional human gate. On entry: flag the bead for human decision — bd update <id> --add-label human (the human label is what bd human list reads; bd human <id> is NOT a command) — so the dispatcher notifies Nick (title, spec path, PR link). Approval is a conversation: Nick reviews with Fable; Fable may edit the spec WITH Nick (Fable never executes pipeline work) and records the outcome. Recording IS the authorization: resolve the gate plus a bead note (approved-by, via, timestamp, spec revision). Waiting here is waiting_on_human, NEVER a park condition. If the conversation changes the contract delta, re-run ./dev spec-check before resolving."
depends_on = ["spec"]

[steps.gate]
type = "human"
reason = "Nick approves the spec in conversation with Fable; recording the approval is the authorization (GATE spec-approval)."

[[steps]]
id = "build"
title = "Build"
description = "Sonnet (escalation per failure policy), 90m time-box, one continuous pass. (1) Plan the work order: which files in what sequence, which neighbor module each copy-adapts from (neohaskell-implementer discipline). (2) Tests FIRST from the criteria table, red for the right reason before any implementation; never weaken an existing expectation (expectation-guard hook; .claude/allow-expectation-edits is the only override); new spec modules registered in the suite's Main.hs AND cabal other-modules (only nhcore-test is hspec-discovered). (3) Implement via the repair loop: ./dev check, never cabal build in the loop; max 2 repair rounds per error, then escalate sonnet->opus, then park. Scope fence: touch only files in the binding plan; needing others = park wrong-localization. Done when ./dev check is green and the criteria tests pass locally."
depends_on = ["spec-approval"]

[[steps]]
id = "verify"
title = "Verify (opus verdict V1-V9)"
description = "Opus, FRESH agent — never the build agent (the writer cannot audit itself), 30m time-box. Produces the V1-V9 verdict on the bead, each PASS/FAIL with evidence: V1 ./dev check clean, no new warnings. V2 every criterion's test is RED on the base branch and GREEN on the head branch (the anti-tautology lock: a test passing on both proves nothing). V3 targeted regression (spec-check --plan test_impact_globs) plus full suite (./dev test-all, once, here only) green. V4 ./dev spec-drift clean: the public API of the diff equals the approved contract delta — nothing extra exported, no promise omitted. V5 dialect and composability: new primitives/API conform to neohaskell-dialect-rules (correctness lives in primitive design; this is the judgment check that cannot be skipped). V6 no existing expectation weakened; any allowed edit's rationale confirmed. V7 scope fence: the diff stays within the binding touches:/files:. V8 ./dev lint green. V9 security/perf sanity — run by a SONNET subagent with the concrete checklist in the skill, max 2 iterations, never a certification exercise; judgment checks only (deterministic ones like secret scanning live in CI: the gitleaks job in checks.yml): external input validated at trust boundaries; no shell/SQL built by concatenating external input; resources released on error paths; where the contract involves shared state or parallelism, the criteria tests actually STRESS concurrency (parallel invocations, race conditions); no unbounded accumulation or obviously-quadratic hot path over user-sized input. V9 findings are FAILs like any other. Any FAIL bounces back to build (max 2 bounces, then park). Done when all nine are PASS and the verdict is written to the bead. The complete verdict is a precondition of merge authorization in the pr step."
depends_on = ["build"]

[[steps]]
id = "pr"
title = "PR & merge"
description = "Haiku for mechanics, sonnet for triage, 45m time-box excluding gate waits. (1) Flip the draft PR to ready (re-triggers the full CI matrix); PR body: spec link, criteria-to-test mapping, the V1-V9 verdict. (2) ci-settle loop, BOT-AGNOSTIC: every reviewing bot's comments count (CodeRabbit today, whichever tomorrow — never assume one vendor). Watch checks (haiku), read every new bot comment via ./dev pr-comments <pr#>, triage (sonnet) — fix real findings; decline with a stated reason as a reply on the comment when the finding is wrong or targets generator-owned files (codemap/**, CHANGELOG.md, bd-generated skills: re-run the generator, never hand-edit); loop until the matrix is green AND every bot has settled with zero unaddressed actionable comments. Settling the bots is a hard exit condition of this step, not a courtesy. The CI wait lives INSIDE this agent's loop — never attach a pour-time gh:run gate to this step (it would block the step that creates the CI run it awaits); if the wait outgrows the session, create the gate at runtime (bd gate create --type=gh:run --blocks <this-pr-bead> --await-id=<run-id>) and exit cleanly — the dispatcher relaunches this step when it resolves. (3) Merge path, decided by the APPROVED spec: breaking: false and no public-API surface beyond the declared delta -> AUTO-MERGE (squash) once CI is green and the V1-V9 verdict is complete, recording merged-by: auto on the bead; breaking: true or ADR attached -> create a human gate blocking THIS pr bead (bd gate create --type=human --blocks <pr-bead-id> --reason=\"GATE 2: breaking change, Nick merges\") plus bd update <pr-bead-id> --add-label human to notify Nick (GATE 2): only Nick merges. Done when the PR is merged."
depends_on = ["verify"]
