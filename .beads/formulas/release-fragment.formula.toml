formula = "release-fragment"
description = "Formula D (release-fragment): per-change release-notes and (when triggered) migration fragments, written while context is fresh; releases only aggregate later via release-publish. Input: approved spec + final diff (formula B verify closed). Output: fragments consumed on demand by formula E. See docs/processes/neohaskell-change.md, Formula D."

[vars.issue]
description = "The request these fragments are for: issue#NNN or adhoc:<slug>."
required = true

[[steps]]
id = "notes-fragment"
title = "Notes fragment"
description = "Depends on formula B's verify step completing (external dependency, wired by the dispatcher when both formulas are poured for the same issue). Write docs/releases/unreleased/NNN-slug.md: user-facing what/why, not a commit list, in audience-level language, linked to the spec. Done when the fragment is committed. Never n/a: every merged change has a notes fragment, even a one-liner. Run by doc-writer (persona: docs, standard tier)."
depends_on = []

[[steps]]
id = "migration-fragment"
title = "Migration fragment"
description = "Depends on formula B's verify step completing, and only runs when breaking: is true or an ADR flags migration impact; otherwise closes as n/a. Write docs/releases/unreleased/NNN-slug.migration.md: what breaks, exact before/after, mechanical upgrade steps, verified against the actual diff rather than the spec's original intention. Done when the fragment is committed and verified against the real diff. Run by doc-writer (persona: docs, standard tier)."
depends_on = []
