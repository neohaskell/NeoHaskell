formula = "change-docs"
description = "Formula C (change-docs): user-facing documentation for a change, drafted alongside implementation and reconciled against the final diff. Input: an approved spec (formula A closed). Output: user-facing documentation for the change, landing in the same PR. See docs/processes/neohaskell-change.md, Formula C."

[vars.issue]
description = "The request this documentation is for: issue#NNN or adhoc:<slug>."
required = true

[[steps]]
id = "docs-draft"
title = "Docs draft"
description = "Starts in parallel with formula B. From the spec alone, work out what the user-visible surface is and which existing docs pages are affected, then draft the new/changed pages. If the change has no user-visible surface, close as n/a with one stated reason: the explicit skip is required, silence is not. Done when draft pages are committed to the branch, marked draft. Run by doc-writer (persona: docs, standard tier); writes English only (translations are a release-time concern) and applies progressive disclosure, opening accessible before descending into technicalities."
depends_on = []

[[steps]]
id = "docs-reconcile"
title = "Docs reconcile"
description = "Depends on formula B's verify step completing (external dependency, wired by the dispatcher when both formulas are poured for the same issue). Diff-check the draft against the final implementation: signatures, names, behavior, and examples actually compile/run. Done when the docs match the final diff and the draft marker is removed. Run by doc-writer (persona: docs, standard tier); checked for progressive-disclosure violations by the docs-auditor patrol."
depends_on = ["docs-draft"]
