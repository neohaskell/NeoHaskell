formula = "release-publish"
description = "Formula E (release-publish), separate and on-demand: aggregate accumulated fragments into a release, gate on Nick's approval, then publish. Input: docs/releases/unreleased/* accumulated since the last tag. Output: a published release. See docs/processes/neohaskell-change.md, Formula E."

[vars.version]
description = "Target release version to publish, e.g. 0.9.0."
required = true

[[steps]]
id = "aggregate"
title = "Aggregate"
description = "Compile the accumulated docs/releases/unreleased/* fragments into release notes and a migration guide, ordered by impact, and propose a version bump from the fragments' breaking flags. SemVer under v0: MAJOR stays 0; only MINOR (features/breaking) and PATCH move. Version proposal derives from fragments' breaking flags accordingly (a fragment marked breaking proposes a MINOR bump, not MAJOR, until v1). Done when the compiled notes and proposed version are written to the bead. Run by doc-writer (persona: docs, standard tier)."
depends_on = []

[[steps]]
id = "release-checker"
title = "Release checker"
description = "Mechanical checker node: verifies every merged change since the last tag has its fragment, the migration guide covers every breaking fragment, and the changelog is generated rather than hand-edited. A failed check loops back to aggregate. Done when all checks are green. No agent persona: mechanical evaluation only, per checker discipline."
depends_on = ["aggregate"]

[[steps]]
id = "publish-approval"
title = "Publish approval"
description = "Nick approves the version number and the release notes before anything is tagged or shipped. Waiting here is waiting_on_human, not a failure; never park on this gate. Recording the approval via bd gate resolve closes the gate and IS the authorization record. Closing this gate unblocks publish."
depends_on = ["release-checker"]

[steps.gate]
type = "human"
reason = "Nick approves version + release notes before publish (GATE publish, formula E)."

[[steps]]
id = "publish"
title = "Publish"
description = "Mechanical: tag the release, build, run the installer/release pipeline, and move fragments from unreleased/ into the version folder. SemVer under v0: MAJOR stays 0; only MINOR and PATCH move -- refuses to tag a v0 MAJOR bump even if the approved version proposal somehow named one. Done when the tag is pushed, artifacts are built, and the unreleased/ fragments are relocated. No agent persona: mechanical execution against the approved aggregate output."
depends_on = ["publish-approval"]
