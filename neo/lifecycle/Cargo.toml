[package]
name = "neo-lifecycle"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "neo-installer"
path = "src/bin/neo-installer.rs"

[dependencies]
fs2 = "0.4"
libc = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
semver = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
