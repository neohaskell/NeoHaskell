[package]
description = "NeoHaskell installer"
license = "MIT"
repository = "https://github.com/neohaskell/NeoHaskell"

name = "neo-install"
version = "0.1.2"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
console = "0.15"
anyhow = "1"
thiserror = "2"
which = "7"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
