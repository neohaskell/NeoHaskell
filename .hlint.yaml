# NeoHaskell dialect checks. Run the owned gate documented in
# .agents/skills/neohaskell-code-guidelines/references/static-checks.md.

- arguments: [--color, --cpp-simple, -XQuasiQuotes]

# --- 1. Module restrictions (vanilla -> Core wrapper) ------------------------
- modules:
    # Core Text
    - {name: [Data.Text, Data.Text.IO, Data.Text.Encoding, Data.Text.Lazy, Data.Text.Lazy.Encoding, Data.Text.Internal.Search],
       within: [Auth.Jwt, Auth.MiddlewareSpec, Basics, Config.TH, Console, Decimal, File, Json, Log, Service.Transport.Mcp.Protocol, Service.Transport.WebSpec, Task, Test.Auth.Jwt.Core, Text, ToText, Uuid],
       message: "Use Core `Text` (import Text qualified). Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Core Char
    - {name: [Data.Char],
       within: [Auth.UrlValidation, Char, Config.TH, Decimal, Layout.Internal.Render, NeoQL.Parser, Service.FileUpload.ContentDedupSpec, Service.Integration.Selection],
       message: "Use Core `Char`. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Array/LinkedList
    - {name: [Data.List],
       within: [Auth.Hostname, ConcurrentMap, Http.ClientSpec, LinkedList, Parser.Internal.Error, Service.CommandExecutor.TH, Service.Integration.AdapterSpec, Service.Integration.Selection, Service.Integration.TestFixtures, Service.Query.TH, Service.Transport.Web, Test.Service.EventStore.Subscriptions.Spec, Version],
       message: "Use Core `Array` or `LinkedList`. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Core Map
    - {name: [Data.Map, Data.Map.Strict],
       within: [Auth.Jwt, Main, Map, Service.Integration.DispatchRegistry],
       message: "Use Core `Map`. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Core Maybe
    - {name: [Data.Maybe],
       within: [Config.BuilderSpec, Config.InputValidationSpec, Config.TH, Integration.Oura.SyncAllSpec, LinkedList, Maybe, Service.Integration.Selection],
       message: "Use Core `Maybe`. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Result
    - {name: [Data.Either],
       within: [AsyncTask, Auth.OAuth2.StateToken, Auth.UrlValidation, Command, Config, Config.THSpec, Directory, Environment, Http.Client, Http.Client.Internal, Json, NeoQL.Parser, Parser, Parser.Internal, RedactedSpec, Service.Integration.Dispatcher, Task, TaskSpec],
       message: "Use `Result err val`, never Either. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Core Set
    - {name: [Data.Set],
       within: [Parser, Parser.Internal.Error, Set, SetSpec],
       message: "Use Core `Set`. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Array (vector)
    - {name: [Data.Vector, Data.Vector.Mutable],
       within: [Array, Collection, Service.EventStore.Postgres.Sessions],
       message: "Use Core `Array`. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Core IO/Console/File
    - {name: [System.IO],
       within: [Auth.OAuth2.Client, Auth.UrlValidation, Http.Client, Http.Client.Internal, Main, Service.Application, Service.ApplicationSpec, Service.Transport.Mcp],
       message: "Use Core `IO`/`Console`/`File`. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Environment
    - {name: [System.Environment],
       within: [Command, Config, Console, Environment, Log, Main, Service.Integration.Selection],
       message: "Use Core `Environment`. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Directory/Path
    # Integration.Video.ExtractAudio.Internal: needs the OS temp directory for
    # the video/WAV temp files; belongs-in: Core `Directory` (getTemporary).
    - {name: [System.Directory],
       within: [Directory, DirectorySpec, Environment, File, Integration.Pdf.ExtractText.Internal, Integration.Video.ExtractAudio.Internal, Subprocess],
       message: "Use Core `Directory`/`Path`. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # Json
    - {name: [Data.Aeson, Data.Aeson.Key, Data.Aeson.KeyMap, Data.Aeson.Types, Data.Aeson.Encoding],
       within: [Auth.Config, Auth.Jwt, Auth.OAuth2.Types, Basics, Command, Config.TH, Config.THSpec, Decimal, DecimalSpec, Integration, Json, NeoQL.Execute, Redacted, RedactedSpec, Schema.JsonSchema, Schema.OpenApi, Service.FileUpload.Core, Service.FileUpload.Routes, Service.Query.PaginationSpec, Service.TH.Boilerplate, Service.Transport.Mcp.JsonRpc, Service.Transport.Mcp.Protocol, Service.Transport.Web, Service.Transport.Web.HealthCheckSpec, Service.Transport.Web.ReadinessRouteSpec, Set, Test.Auth.Jwt.Core],
       message: "Use Core `Json`. Use the owning core API. Add missing operations in a core prerequisite PR."}
    # no GHC.Base
    - {name: [GHC.Base],
       within: [Basics, Service.CommandExecutor.TH, Service.OutboundIntegration.TH, Service.Query.TH, TypeName],
       message: "Use the owning Core or Basics API. Add missing operations in a core prerequisite PR."}

- modules:
    - {name: [Control.Exception, Control.Exception.Base], within: [Task, AsyncTask, IO], message: "NeoHaskell ownership. Exception mechanisms belong in Task, AsyncTask, or IO."}
    - {name: [Data.IORef], within: [Var], message: "NeoHaskell ownership. Use Var or an atomic concurrency API according to the invariant."}
    - {name: [GHC.Conc, GHC.Conc.Sync], within: [AsyncTask], message: "NeoHaskell ownership. Thread inspection belongs in the owning concurrency API."}
    - {name: [Control.Concurrent.Async], within: [AsyncTask, Subprocess], message: "NeoHaskell ownership. Use AsyncTask for task concurrency. Raw Async belongs to AsyncTask or subprocess IO coordination."}
    - {name: [Control.Concurrent.STM], within: [AtomicVar, Channel, ConcurrentMap], message: "NeoHaskell ownership. STM coordination belongs in the owning core concurrency API. Add missing operations in a core prerequisite PR."}
    - {name: [Control.Concurrent.STM.TBQueue], within: [Channel], message: "NeoHaskell ownership. Bounded queue operations belong in Channel. Add missing operations in a core prerequisite PR."}
    - {name: [Control.Concurrent.Async.Internal], within: [], message: "NeoHaskell ownership. Use the public Async API only in its named owners."}
    - {name: [Control.Monad.STM, Control.Concurrent.STM.TVar, Control.Concurrent.STM.TMVar, Control.Concurrent.STM.TChan, Control.Concurrent.STM.TQueue, Control.Concurrent.STM.TArray], within: [], message: "NeoHaskell ownership. Use owning core concurrency APIs. Existing STM owners use the public umbrella module."}

