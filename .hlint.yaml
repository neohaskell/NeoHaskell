      within: [Task, AsyncTask, IO, Directory, File, Subprocess]
      message: "NeoHaskell ownership. Internal exception imports belong in the owning core modules. Services use owning Task operations."

- modules:
    - {name: [System.Directory.Internal.Prelude], within: [], message: "NeoHaskell ownership. Use public system APIs at system boundaries and owning Task operations for exception control."}
- functions:
    - name: [GHC.IO.Exception.ioException, GHC.IO.Exception.ioError, GHC.IO.Exception.assertError]
      within: [Task, AsyncTask, IO]
      message: "NeoHaskell ownership. Exception control belongs in Task, AsyncTask, or IO. System boundary types remain allowed."
