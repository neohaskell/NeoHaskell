name: Semantic Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [auto, bootstrap, recover, resume]
        default: auto
      baseline:
        description: Existing baseline tag (manual bootstrap only)
        type: string
      version:
        description: Reviewed first version, 0.Y.Z (manual bootstrap only)
        type: string
      attempt:
        description: Full failed attempt ID (recover/resume only)
        type: string
      reason:
        description: Why this unpublished release needs a source fix
        type: string
env:
  NEOHASKELL_ROOT: ${{ github.workspace }}
permissions:
  contents: read
concurrency:
  group: semantic-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tooling_revision: ${{ steps.tooling.outputs.revision }}
      platform_has_work: ${{ steps.plan.outputs.platform_has_work }}
      platform_items: ${{ steps.plan.outputs.platform_items }}
      platform_matrix: ${{ steps.plan.outputs.platform_matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: tooling
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Release engine self-tests (offline)
        run: ./.agents/skills/neohaskell-release/scripts/semantic-release --self-test
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation || 'auto' }}
          BASELINE: ${{ inputs.baseline }}
          VERSION: ${{ inputs.version }}
          ATTEMPT: ${{ inputs.attempt }}
          REASON: ${{ inputs.reason }}
        run: >-
          ./.agents/skills/neohaskell-release/scripts/semantic-release orchestrate --operation "$OPERATION"
          --baseline "$BASELINE" --version "$VERSION"
          --attempt "$ATTEMPT" --reason "$REASON"
  platform_seed:
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.platform_has_work == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platform_items) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        if: matrix.reuse != true
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tooling_revision }}
          path: .agents-state/release-tooling
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
        if: matrix.reuse != true
      - name: Freeze the starter at the merged release revision
        if: matrix.reuse != true
        env:
          ATTEMPT: ${{ matrix.attempt }}
          REVISION: ${{ matrix.revision }}
        run: ./.agents-state/release-tooling/.agents/skills/neohaskell-release/scripts/semantic-release seed --attempt "$ATTEMPT" --revision "$REVISION" --out inputs
      - uses: actions/upload-artifact@v7
        if: matrix.reuse != true
        with:
          name: inputs-${{ matrix.attempt }}
          path: inputs/*
          if-no-files-found: error
  platform_native:
    needs: [prepare, platform_seed]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.platform_has_work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.platform_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        if: matrix.reuse != true
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tooling_revision }}
          path: .agents-state/release-tooling
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
        if: matrix.reuse != true && matrix.target != 'x86_64-apple-darwin'
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2; supports Intel macOS
        if: matrix.reuse != true && matrix.target == 'x86_64-apple-darwin'
      - uses: dtolnay/rust-toolchain@1.94.0
        if: matrix.reuse != true
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        if: matrix.reuse != true
        with:
          name: inputs-${{ matrix.attempt }}
          path: inputs
      - name: Test, build, inspect and smoke the exact native asset
        if: matrix.reuse != true
        env:
          ATTEMPT: ${{ matrix.attempt }}
          REVISION: ${{ matrix.revision }}
          TARGET: ${{ matrix.target }}
        run: ./.agents-state/release-tooling/.agents/skills/neohaskell-release/scripts/semantic-release build-native --attempt "$ATTEMPT" --revision "$REVISION" --target "$TARGET" --inputs inputs --out artifacts
      - uses: actions/upload-artifact@v7
        if: matrix.reuse != true
        with:
          name: release-${{ matrix.attempt }}-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
  platform_consumer:
    needs: [prepare, platform_native]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.platform_has_work == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platform_items) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tooling_revision }}
          path: .agents-state/release-tooling
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
        if: matrix.reuse != true
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        if: matrix.reuse != true
      - uses: actions/download-artifact@v8
        if: matrix.reuse != true
        with:
          name: inputs-${{ matrix.attempt }}
          path: inputs
      - uses: actions/download-artifact@v8
        if: matrix.reuse != true
        with:
          name: release-${{ matrix.attempt }}-x86_64-unknown-linux-gnu
          path: artifacts
      - name: Build and run an app with the exact release binary and framework
        if: matrix.reuse != true
        env:
          ATTEMPT: ${{ matrix.attempt }}
          REVISION: ${{ matrix.revision }}
        run: ./.agents-state/release-tooling/.agents/skills/neohaskell-release/scripts/semantic-release consumer --attempt "$ATTEMPT" --revision "$REVISION" --inputs inputs --out artifacts
      - uses: actions/upload-artifact@v7
        if: matrix.reuse != true
        with:
          name: release-${{ matrix.attempt }}-consumer
          path: artifacts/consumer.json
          if-no-files-found: error
  platform_cache:
    needs: [prepare, platform_native, platform_consumer]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.platform_has_work == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platform_items) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - id: cache-auth
        if: matrix.reuse != true
        name: Check optional cache credentials
        env:
          CACHE_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -n "$CACHE_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No CACHIX_AUTH_TOKEN configured; skipping optional cache population."
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.cache-auth.outputs.enabled == 'true'
        with:
          ref: ${{ needs.prepare.outputs.tooling_revision }}
          path: .agents-state/release-tooling
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
        if: steps.cache-auth.outputs.enabled == 'true'
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        if: steps.cache-auth.outputs.enabled == 'true'
      - uses: actions/download-artifact@v8
        if: steps.cache-auth.outputs.enabled == 'true'
        with:
          name: release-${{ matrix.attempt }}-x86_64-unknown-linux-gnu
          path: artifacts
      - name: Make the seeded release binary executable
        if: steps.cache-auth.outputs.enabled == 'true'
        run: chmod +x artifacts/neo-x86_64-unknown-linux-gnu
      - id: push-cache
        if: steps.cache-auth.outputs.enabled == 'true'
        continue-on-error: true
        uses: cachix/cachix-action@v17
        with:
          name: neohaskell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Prime the default closure from the seeded release binary
        if: steps.cache-auth.outputs.enabled == 'true' && steps.push-cache.outcome == 'success'
        env:
          NEOHASKELL_ROOT: ${{ github.workspace }}/.agents-state/release-tooling
          NEO_BIN: ${{ github.workspace }}/artifacts/neo-x86_64-unknown-linux-gnu
          PRIME_EXPECTED_REVISION: ${{ matrix.revision }}
          PRIME_BUILD_TIMEOUT: "5400"
          PRIME_TEST_TIMEOUT: "2400"
          PRIME_RUN_TIMEOUT: "30"
        run: ./.agents-state/release-tooling/.agents/skills/neohaskell-release/scripts/cache-prime
  platform_publish:
    needs: [prepare, platform_native, platform_consumer]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.platform_has_work == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.platform_items) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tooling_revision }}
          path: .agents-state/release-tooling
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: matrix.reuse != true
        with:
          pattern: release-${{ matrix.attempt }}-*
          path: artifacts
          merge-multiple: true
      - name: Verify provenance and publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ matrix.attempt }}
          REVISION: ${{ matrix.revision }}
        run: ./.agents-state/release-tooling/.agents/skills/neohaskell-release/scripts/semantic-release publish --attempt "$ATTEMPT" --revision "$REVISION" --out artifacts
  reconcile:
    needs: [prepare, platform_publish]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.platform_publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tooling_revision }}
          path: .agents-state/release-tooling
          persist-credentials: false
      - name: Prepare notes that accumulated while the release was building
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.agents-state/release-tooling/.agents/skills/neohaskell-release/scripts/semantic-release orchestrate
