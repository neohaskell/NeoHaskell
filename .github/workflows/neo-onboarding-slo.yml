name: Neo Onboarding SLO

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      installer_version:
        description: "IMMUTABLE installer release tag to measure (installer-vX.Y.Z — never 'latest')"
        type: string
        required: true
      neo_version:
        description: "IMMUTABLE neo CLI release tag to measure (neo-vX.Y.Z — never 'latest')"
        type: string
        required: true
      expected_source_sha:
        description: "Required reviewed commit SHA; must equal dispatched github.sha and both peeled release-tag SHAs"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: neo-onboarding-slo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Release workflow fixtures (offline)
        run: ./.agents/skills/neohaskell-release/scripts/semantic-release --self-test workflow
      - name: Onboarding orchestration self-test (offline — no download, no secret, no publish)
        run: ./.agents/skills/neohaskell-release/scripts/onboarding-slo --self-test

  slo:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Start the global onboarding deadline (pre-prerequisite, same-host monotonic)
        run: |
          python3 -c "import time,os; open(os.environ['GITHUB_ENV'],'a').write('SLO_MONOTONIC_START=%r\n' % time.monotonic())"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # NOTE: do NOT install Nix here. The measured release installer provisions
      # Nix itself (Determinate), and a second Determinate install in a workflow
      # step collides with it (`/nix/receipt.json` planner mismatch), failing the
      # install phase. The clean runner therefore stays Nix-free; the installer's
      # Nix install is part of the measured path (inside the 600 s deadline). The
      # driver (release skill onboarding-slo) reproduces the post-install Nix login env
      # and configures the public caches tokenlessly for the measured commands.
      - name: Measure clean-machine onboarding (immutable inputs, checksum-verified, fail-closed)
        env:
          SLO_INSTALLER_VERSION: ${{ inputs.installer_version }}
          SLO_NEO_VERSION: ${{ inputs.neo_version }}
          SLO_TARGET: ${{ matrix.target }}
          SLO_SOURCE_SHA: ${{ github.sha }}
          SLO_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          SLO_DISPATCHED_SOURCE_SHA: ${{ github.sha }}
          SLO_WORKFLOW_RUN_ID: ${{ github.run_id }}
          SLO_WORKFLOW_REF: ${{ github.ref }}
          SLO_DEADLINE: "600"
          SLO_MONOTONIC_START: ${{ env.SLO_MONOTONIC_START }}
          SLO_EVIDENCE: ${{ runner.temp }}/onboarding-slo-${{ matrix.target }}.json
        run: ./.agents/skills/neohaskell-release/scripts/onboarding-slo run
      - name: Upload immutable SLO evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onboarding-slo-evidence-${{ matrix.target }}-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/onboarding-slo-${{ matrix.target }}.json
            ${{ runner.temp }}/onboarding-slo-${{ matrix.target }}.json.sha256
          if-no-files-found: error
