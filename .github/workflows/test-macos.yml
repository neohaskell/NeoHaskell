name: "Test macOS"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "integrations/**"
      - "testbed/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "cabal.project"
      - "scripts/nix-components"
      - ".github/workflows/test-macos.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=

      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build components once for macOS
        run: ./dev nix-components build
      - name: Publish complete closure for consumers
        run: ./dev nix-components export
      - uses: actions/upload-artifact@v7
        with:
          name: haskell-components-macos
          path: component-artifact
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  tests-macos:
    needs: build-macos
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - nhcore-test-auth
          - nhcore-test-core
          - nhcore-test-integration
          - nhcore-test-service
          - nhintegrations-test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=

      - uses: actions/download-artifact@v8
        with:
          name: haskell-components-macos
          path: component-artifact
      - name: Fetch exact outputs without compilation
        run: ./dev nix-components fetch
      - name: Start PostgreSQL fixture with password authentication
        if: matrix.test-suite == 'nhcore-test-service'
        env:
          PGPASSWORD: neohaskell
        run: |
          set -euo pipefail
          root="$(cat component-artifact/root.txt)"
          export PATH="$root/runtime/bin:$PATH"
          pg_bin="$(dirname "$(realpath "$root/runtime/bin/initdb")")"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/nh-postgres" -U neohaskell \
            --auth-local=trust --auth-host=scram-sha-256 \
            --pwfile=<(printf '%s\n' neohaskell)
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/nh-postgres" -l "$RUNNER_TEMP/postgres.log" \
            -o "-h 127.0.0.1 -p 5432 -k $RUNNER_TEMP -c max_connections=200" -w start
          "$pg_bin/createdb" -h 127.0.0.1 -U neohaskell neohaskell
      - name: Run ${{ matrix.test-suite }} from the store
        env:
          SUITE: ${{ matrix.test-suite }}
        run: ./dev nix-components run --suite "$SUITE"
      - name: Stop disposable PostgreSQL fixture
        if: always() && matrix.test-suite == 'nhcore-test-service'
        run: |
          if [ -f "$RUNNER_TEMP/nh-postgres/postmaster.pid" ]; then
            root="$(cat component-artifact/root.txt)"
            pg_bin="$(dirname "$("$root/runtime/bin/realpath" "$root/runtime/bin/pg_ctl")")"
            "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/nh-postgres" -m fast -w stop
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-${{ matrix.test-suite }}-evidence
          path: |
            component-report.log
            component-artifact/timings.jsonl
            ${{ runner.temp }}/postgres.log
          retention-days: 14

  ci-gate-macos:
    if: always()
    needs: [build-macos, tests-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require build and all macOS suites
        env:
          BUILD: ${{ needs.build-macos.result }}
          TESTS: ${{ needs.tests-macos.result }}
        run: test "$BUILD" = success && test "$TESTS" = success
