name: "Test"

on:
  workflow_dispatch:
    inputs:
      baseline_measurements:
        description: Also collect three isolated baseline observations (additional runner time)
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      # Neo CLI monorepo migration (bootstrap): scoped PRs land on the staging
      # integration branch first, so the required Test gate must run on them
      # exactly as it does on main. `main` behavior is unchanged — this only
      # ADDS the integration base. The branch is retired at the final merge.
      - integration/neo-monorepo
    # ready_for_review is NOT a default activity type — without it, flipping
    # a draft to ready would never re-trigger the suite the guard skipped
    types: [opened, synchronize, reopened, ready_for_review]
    # NB: no workflow-level `paths:` on pull_request. A REQUIRED check must always
    # report — a path-filtered workflow that never runs leaves its check pending
    # forever and blocks tooling-only PRs. Path gating moves to the `changes` job
    # below: heavy jobs SKIP when nothing compiled changed, and `ci-gate` (always
    # runs) accepts those skips, so it is a sound required check.
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "testbed/**"
      - "integrations/**"
      - "nix/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  # DRAFT-PR CI GUARD (pipeline Phase 5, task 3): a draft PR is a parked spec
  # awaiting the maintainer's gate decision — burning ~1h of build+test on it
  # is waste. The heavy jobs skip on drafts (dependents skip transitively);
  # ci-gate accepts the skips only while the PR stays a draft. Marking the PR
  # ready-for-review re-triggers the full matrix. checks.yml (doctor, codemap,
  # lint, spec) still runs on drafts — seconds, and it is what validates the
  # spec itself.
  # Path gating at the JOB level (not the workflow level — see the note under
  # `on:`). `compiled` is true when a PR touches anything that can change a
  # build/test outcome; on push it is always true (the push paths filter already
  # ensured that). Cheap (~15s) so it can run on every PR.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compiled: ${{ steps.detect.outputs.compiled }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "compiled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `neo/` is deliberately ABSENT: the Neo CLI is a Rust crate with its
          # own required component workflow (neo-ci.yml, which runs on arbitrary
          # stacked-PR bases and gates fmt/tests/nix-build). The cabal build here
          # neither compiles nor tests it, so a neo-only PR must NOT drag the
          # whole Haskell suite. `installer/` is absent for the same reason
          # (installer-ci.yml). `flake.nix` stays: the Haskell hix outputs are
          # defined there, so a flake change still rebuilds them.
          PATTERN='^(core/|testbed/|integrations/|nix/|\.github/workflows/|cabal\.project|flake\.nix|flake\.lock|scripts/nix-components)'
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE "$PATTERN"; then
            echo "compiled=true" >> "$GITHUB_OUTPUT"
          else
            echo "compiled=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
      && needs.changes.outputs.compiled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build Nix component outputs
        run: ./dev nix-components build
      - name: Publish closure for consuming jobs (no credentials required)
        run: ./dev nix-components export
      - uses: actions/upload-artifact@v7
        with:
          name: haskell-components
          path: component-artifact
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  codemap-sync:
    # Documentation/index generation retains its Cabal route until equivalent
    # Nix artifacts are validated. Run alongside the component build and tests.
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
      && needs.changes.outputs.compiled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      # Haddock/hoogle and .hie tooling still use the full Cabal workspace.
      - uses: actions/cache@v6.1.0
        with:
          path: dist-newstyle
          key: ${{ runner.os }}-codemap-${{ hashFiles('**/*.cabal', 'cabal.project', 'flake.lock') }}
          restore-keys: |
            ${{ runner.os }}-codemap-
      # Hackage hoogle txts for the ./dev api vanilla DB (dep-closure mined;
      # see ADR-0066) — cached so the fetch is a no-op on warm runs.
      - uses: actions/cache@v6.1.0
        with:
          path: .hoogle-vanilla-src
          key: ${{ runner.os }}-hoogle-vanilla-${{ hashFiles('flake.lock', '**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-hoogle-vanilla-
      - name: Regenerate codemap + build/smoke-check hoogle DBs (canary — same flow as local ./dev codemap)
        run: CODEMAP_PROJECT=cabal.project ./dev codemap
      - name: Sync check — committed codemap must match regenerated
        run: |
          git diff --exit-code codemap/ || {
            echo "::error::codemap out of sync with the code — run ./dev codemap and commit the result"
            exit 1
          }

  # Doctest gate (pipeline Phase 4): the examples on codemap/api-hot.md and
  # codemap/phrasebook.md are mined from source doctests — THIS job is what
  # makes their "doctest-gated" claim true. Runner: scripts/run-doctest
  # (build-free: doctest interprets sources against the dev-shell GHC's
  # package DB, so no dist-newstyle artifact is needed).
  doctest:
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
      && needs.changes.outputs.compiled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Run doctest suite
        run: ./dev doctest

  test-core:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: actions/download-artifact@v8
        with:
          name: haskell-components
          path: component-artifact
      - name: Fetch exact outputs without compilation
        run: ./dev nix-components fetch
      - name: Run nhcore-test-core
        run: ./dev nix-components run --suite nhcore-test-core

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-core-evidence
          path: |
            component-report.log
            .nhcore-test-service.report
            component-artifact/timings.jsonl
          include-hidden-files: true
          retention-days: 14

  test-auth:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: actions/download-artifact@v8
        with:
          name: haskell-components
          path: component-artifact
      - name: Fetch exact outputs without compilation
        run: ./dev nix-components fetch
      - name: Run nhcore-test-auth
        run: ./dev nix-components run --suite nhcore-test-auth

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-auth-evidence
          path: |
            component-report.log
            .nhcore-test-service.report
            component-artifact/timings.jsonl
          include-hidden-files: true
          retention-days: 14

  test-integration:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: actions/download-artifact@v8
        with:
          name: haskell-components
          path: component-artifact
      - name: Fetch exact outputs without compilation
        run: ./dev nix-components fetch
      - name: Run nhcore-test-integration
        run: ./dev nix-components run --suite nhcore-test-integration

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-integration-evidence
          path: |
            component-report.log
            .nhcore-test-service.report
            component-artifact/timings.jsonl
          include-hidden-files: true
          retention-days: 14

  test-integrations:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: actions/download-artifact@v8
        with:
          name: haskell-components
          path: component-artifact
      - name: Fetch exact outputs without compilation
        run: ./dev nix-components fetch
      - name: Run nhintegrations-test
        run: ./dev nix-components run --suite nhintegrations-test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-integrations-evidence
          path: |
            component-report.log
            .nhcore-test-service.report
            component-artifact/timings.jsonl
          include-hidden-files: true
          retention-days: 14

  test-service:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: actions/download-artifact@v8
        with:
          name: haskell-components
          path: component-artifact
      - name: Fetch exact outputs without compilation
        run: ./dev nix-components fetch
      - name: Start PostgreSQL
        run: |
          docker run -d --name neohaskell_postgres \
            -e POSTGRES_USER=neohaskell \
            -e POSTGRES_PASSWORD=neohaskell \
            -e POSTGRES_DB=neohaskell \
            -p 5432:5432 \
            postgres:16-alpine \
            postgres -c max_connections=200
          for _ in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -U neohaskell; then break; fi
            sleep 1
          done
          if ! pg_isready -h 127.0.0.1 -U neohaskell; then
            echo "::error::PostgreSQL failed to start within 30 seconds"
            exit 1
          fi
        env:
          PGPASSWORD: neohaskell
      - name: Run nhcore-test-service
        env:
          POSTGRES_AVAILABLE: "true"
        run: |
          set -o pipefail
          ./dev nix-components run --suite nhcore-test-service \
            --report .nhcore-test-service.report
      - name: Prove integration criterion selectors and real fixtures
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          POSTGRES_AVAILABLE: "true"
        run: ./dev spec-check --criteria-runtime "origin/${BASE_REF}" --report .nhcore-test-service.report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-service-evidence
          path: |
            component-report.log
            .nhcore-test-service.report
            component-artifact/timings.jsonl
          include-hidden-files: true
          retention-days: 14

  test-hurl:
    needs: [build]
    runs-on: ubuntu-latest
    # Retain the existing budget until closure-transfer measurements justify it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: actions/download-artifact@v8
        with:
          name: haskell-components
          path: component-artifact
      - name: Fetch exact outputs without compilation
        run: ./dev nix-components fetch
      - name: Start PostgreSQL
        run: |
          docker run -d --name neohaskell_postgres \
            -e POSTGRES_USER=neohaskell \
            -e POSTGRES_PASSWORD=neohaskell \
            -e POSTGRES_DB=neohaskell \
            -p 5432:5432 \
            postgres:16-alpine \
            postgres -c max_connections=200
          for _ in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -U neohaskell; then break; fi
            sleep 1
          done
          if ! pg_isready -h 127.0.0.1 -U neohaskell; then
            echo "::error::PostgreSQL failed to start within 30 seconds"
            exit 1
          fi
        env:
          PGPASSWORD: neohaskell
      - name: Run integration tests
        run: ./dev nix-components hurl
      - name: Prove cold-start health stays flat through 100k events
        run: ./dev nix-components cold-start

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-hurl-evidence
          path: |
            /tmp/neohaskell-cold-start
            component-report.log
            .nhcore-test-service.report
            component-artifact/timings.jsonl
          include-hidden-files: true
          retention-days: 14

  # THE REQUIRED CHECK. `if: always()` + no workflow paths filter ⇒ this always
  # runs and reports a real conclusion on every PR, so it is safe to require in
  # branch protection (unlike the individual, path-skipped jobs). It enforces
  # "the project compiles AND tests pass" whenever there is a compiled surface to
  # check, and passes cleanly when there is nothing to check.
  ci-gate:
    if: always()
    needs: [changes, build, doctest, test-core, test-auth, test-integration, test-integrations, test-service, test-hurl, codemap-sync]
    runs-on: ubuntu-latest
    steps:
      - name: Check all tests passed
        env:
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          COMPILED: ${{ needs.changes.outputs.compiled }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          # Fail closed if path-detection itself failed — otherwise a compiled PR
          # could skip everything and pass on a bad `compiled` reading.
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::changes-detection job did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          # Skips are acceptable ONLY when there is genuinely nothing to test: a
          # draft PR (parked spec) or a PR that changed no compiled surface.
          # Otherwise every build/test job must be success.
          allow_skip=false
          if [[ "$IS_DRAFT" == "true" || "$COMPILED" != "true" ]]; then
            allow_skip=true
          fi
          # codemap-sync runs in parallel; listed last so a test failure is the
          # first error reported when several jobs fail together.
          results=(
            "build=${{ needs.build.result }}"
            "doctest=${{ needs.doctest.result }}"
            "test-core=${{ needs.test-core.result }}"
            "test-auth=${{ needs.test-auth.result }}"
            "test-integration=${{ needs.test-integration.result }}"
            "test-integrations=${{ needs.test-integrations.result }}"
            "test-service=${{ needs.test-service.result }}"
            "test-hurl=${{ needs.test-hurl.result }}"
            "codemap-sync=${{ needs.codemap-sync.result }}"
          )
          for entry in "${results[@]}"; do
            job="${entry%%=*}"; r="${entry#*=}"
            if [[ "$r" == "skipped" && "$allow_skip" == "true" ]]; then
              continue
            fi
            if [[ "$r" != "success" ]]; then
              echo "::error::$job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "ci-gate: all build/test jobs passed (or correctly skipped — nothing to test)"

  baseline-measurement:
    if: github.event_name == 'workflow_dispatch' && inputs.baseline_measurements
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
        route: [baseline, candidate]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.route == 'baseline' && 'cab923c0b098fdb82ece539380719c0757ec9057' || github.sha }}
          path: baseline
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.22.2
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - name: Start real PostgreSQL fixture
        run: |
          docker run -d --name baseline-postgres \
            -e POSTGRES_USER=neohaskell -e POSTGRES_PASSWORD=neohaskell \
            -e POSTGRES_DB=neohaskell -p 5432:5432 postgres:16-alpine \
            postgres -c max_connections=200
          for _ in $(seq 1 30); do
            if docker exec baseline-postgres pg_isready -h 127.0.0.1 -U neohaskell; then break; fi
            sleep 1
          done
          docker exec baseline-postgres pg_isready -h 127.0.0.1 -U neohaskell
      - name: Measure immutable checkout and controlled implementation edit
        working-directory: baseline
        env:
          ROUTE: ${{ matrix.route }}
        run: bash "../harness/docs/build-cache/$ROUTE.sh" "$GITHUB_WORKSPACE/harness/docs/build-cache/measure.py" "$GITHUB_WORKSPACE/evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measurement-linux-${{ matrix.route }}-${{ matrix.repetition }}
          path: evidence
          retention-days: 30
          if-no-files-found: error
