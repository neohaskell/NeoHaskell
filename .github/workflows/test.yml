name: "Test"

on:
  pull_request:
    branches:
      - main
      - integration/neo-monorepo
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "testbed/**"
      - "integrations/**"
      - "nix/**"
      - ".agents/skills/neohaskell-test/scripts/run-doctest"
      - ".agents/skills/neohaskell-test/scripts/test_runtime.py"
      - ".agents/skills/neohaskell-best-practices/scripts/bounded_process.py"
      - ".agents/skills/neohaskell-best-practices/scripts/repo-root"
      - ".agents/skills/neohaskell-best-practices/scripts/toolchain-fp"
      - ".agents/skills/neohaskell-best-practices/scripts/with-toolchain"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  pr1019-exact-head:
    if: github.event_name == 'pull_request' && github.head_ref == 'nh139-pr1019-ci-isolation'
    runs-on: macos-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        gate: [strict-suite, guide-evidence]
    env:
      PGHOST: 127.0.0.1
      PGUSER: neohaskell
      PGPASSWORD: neohaskell
      POSTGRES_AVAILABLE: "true"
      DB_HOST: 127.0.0.1
      DB_PASSWORD: neohaskell
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: de8bd03d20b97acc65cb5e528417da9cd4e541a2
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the PR head and record the source revision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr1019"
          head_sha="$(git ls-remote origin refs/heads/nh139-aggregate-actioncontext-test-fixtures | cut -f1)"
          test "$head_sha" = de8bd03d20b97acc65cb5e528417da9cd4e541a2
          test "$(git rev-parse HEAD)" = "$head_sha"
          git rev-parse HEAD | tee "$RUNNER_TEMP/pr1019/source.sha"
          printf '%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" | tee "$RUNNER_TEMP/pr1019/run.url"
      - name: Install macOS test dependencies
        run: |
          brew install bash hurl poppler postgresql@16
          pg_bin="$(brew --prefix postgresql@16)/bin"
          echo "$pg_bin" >> "$GITHUB_PATH"
          echo "PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - uses: DeterminateSystems/determinate-nix-action@v3.24.0
        with:
          extra-conf: |
            accept-flake-config = true
            http2 = false
            extra-substituters = https://neohaskell.cachix.org?priority=30 https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Start a private PostgreSQL 16 cluster
        run: |
          set -euo pipefail
          if lsof -nP -iTCP:5432 -sTCP:LISTEN; then
            echo 'Port 5432 already has a listener' >&2
            exit 1
          fi
          pg_data="$RUNNER_TEMP/pr1019-postgres"
          printf 'neohaskell\n' > "$RUNNER_TEMP/pr1019-postgres-password"
          "$PG_BIN/initdb" -D "$pg_data" -U neohaskell --auth-local=trust --auth-host=scram-sha-256 --pwfile="$RUNNER_TEMP/pr1019-postgres-password"
          rm "$RUNNER_TEMP/pr1019-postgres-password"
          "$PG_BIN/pg_ctl" -D "$pg_data" -l "$RUNNER_TEMP/pr1019/postgres.log" -o '-c listen_addresses=localhost -c port=5432 -c max_connections=200' start
          echo "CI_PGDATA=$pg_data" >> "$GITHUB_ENV"
          "$PG_BIN/createdb" neohaskell
          "$PG_BIN/psql" -XAt -d neohaskell -c "SELECT current_setting('server_version_num'), current_setting('data_directory'), inet_server_addr(), inet_server_port()" | tee "$RUNNER_TEMP/pr1019/postgres-identity.txt"
          test "$("$PG_BIN/psql" -XAt -d neohaskell -c 'SHOW server_version_num' | cut -c1-2)" = 16
          test "$("$PG_BIN/psql" -XAt -d neohaskell -c 'SHOW data_directory')" = "$pg_data"
          test "$("$PG_BIN/psql" -XAt -d neohaskell -c 'SELECT inet_server_addr()')" = 127.0.0.1
          test "$("$PG_BIN/psql" -XAt -d neohaskell -c 'SELECT inet_server_port()')" = 5432
      - name: Run the exact-head strict aggregate
        if: matrix.gate == 'strict-suite'
        run: |
          set +e
          nix develop --command .agents/skills/neohaskell-test/scripts/run-full-suite --strict 2>&1 | tee "$RUNNER_TEMP/pr1019/strict-suite.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/pr1019/strict-suite.exit"
          exit "$status"
      - name: Run the exact-head complete agent guide check
        if: matrix.gate == 'guide-evidence'
        run: |
          set +e
          nix develop --command .agents/skills/neohaskell-consumer-verification/scripts/agent-docs-check --verify-evidence 2>&1 | tee "$RUNNER_TEMP/pr1019/guide-evidence.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/pr1019/guide-evidence.exit"
          exit "$status"
      - name: Stop this job's PostgreSQL cluster
        if: always()
        run: |
          if [ -n "${CI_PGDATA:-}" ] && [ -f "$CI_PGDATA/postmaster.pid" ]; then
            "$PG_BIN/pg_ctl" -D "$CI_PGDATA" -m immediate stop
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr1019-${{ matrix.gate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr1019/
          retention-days: 30
          if-no-files-found: warn

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compiled: ${{ steps.detect.outputs.compiled }}
      run_expensive: ${{ steps.detect.outputs.run_expensive }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          FULL_CI_LABEL_PRESENT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
        run: |
          set -euo pipefail
          run_expensive=true
          if [ "$EVENT" = "pull_request" ]; then
            run_expensive=false
            if [ "$IS_DRAFT" != "true" ] || [ "$FULL_CI_LABEL_PRESENT" = "true" ]; then
              run_expensive=true
            fi
          fi
          echo "run_expensive=$run_expensive" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ]; then
            echo "compiled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATTERN='^(core/|testbed/|integrations/|nix/|\.agents/skills/neohaskell-test/scripts/(run-doctest|test_runtime\.py)$|\.agents/skills/neohaskell-best-practices/scripts/(bounded_process\.py|repo-root|toolchain-fp|with-toolchain)$|\.github/workflows/|cabal\.project|flake\.nix|flake\.lock)'
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE "$PATTERN"; then
            echo "compiled=true" >> "$GITHUB_OUTPUT"
          else
            echo "compiled=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: >-
      needs.changes.outputs.run_expensive == 'true'
      && needs.changes.outputs.compiled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.24.0
        with:
          extra-conf: |
            accept-flake-config = true
            http2 = false
            extra-substituters = https://neohaskell.cachix.org?priority=30 https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/cache@v6.1.0
        with:
          path: dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-
      - name: Build the project with cabal
        run: ./.agents/skills/neohaskell-test/scripts/nix-acquisition-diagnostics nix --debug develop .#ci --command cabal build all --disable-documentation
      - name: Run doctest suite
        run: nix develop .#ci --command ./.agents/skills/neohaskell-test/scripts/run-doctest --strict
      - uses: actions/upload-artifact@v7
        with:
          name: dist-newstyle
          path: dist-newstyle
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test-core:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.24.0
        with:
          extra-conf: |
            accept-flake-config = true
            http2 = false
            extra-substituters = https://neohaskell.cachix.org?priority=30 https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/download-artifact@v8
        with:
          name: dist-newstyle
          path: dist-newstyle
      - name: Run nhcore-test-core
        run: |
          set -o pipefail
          LOG_LEVEL=Warn ./.agents/skills/neohaskell-test/scripts/nix-acquisition-diagnostics nix develop .#ci --command cabal test nhcore-test-core \
            --test-show-details=direct | tee nhcore-test-core.report
      - name: Check outbound payload compiler diagnostics
        run: nix develop .#ci --command python3 core/test/Service/OutboundIntegration/check_compiler_rejections.py
      - name: Check Event Model compiler diagnostics
        run: nix develop .#ci --command python3 core/test/Service/EventModel/check_compiler_rejections.py
      - name: Run source-local Event Model testbed assertions
        run: nix develop .#ci --command cabal test nhtestbed-spec-demo --test-show-details=direct
      - uses: actions/upload-artifact@v7
        with:
          name: nhcore-test-core-report
          path: nhcore-test-core.report
          retention-days: 1
          if-no-files-found: error

  test-transport:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.24.0
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/download-artifact@v8
        with:
          name: dist-newstyle
          path: dist-newstyle
      - name: Run byte transport fixtures
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s core/test/Http -p 'test_transport_fixture.py' -v
          : > transport-fixture.report
          mkdir -p transport-evidence
          for mode in tls proxy body secure-internal-body public-trust public-body; do
            report="transport-evidence/$mode.report"
            nix develop --command core/test/Http/transport_fixture.py "$mode" \
              --evidence-dir "transport-evidence/$mode" | tee "$report"
            test "$(grep -cFx "PASS script:core/test/Http/transport_fixture.py#$mode" "$report")" -eq 1
            test "$(grep -c '^PASS script:' "$report")" -eq 1
            grep -qFx 'fixture: Http.Client.syntheticTransport' "$report"
            cat "$report" >> transport-fixture.report
          done
          test "$(grep -c '^PASS script:' transport-fixture.report)" -eq 6
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transport-fixture-report
          path: |
            transport-fixture.report
            transport-evidence/
          retention-days: 1
          if-no-files-found: error

  test-auth:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.24.0
        with:
          extra-conf: |
            accept-flake-config = true
            http2 = false
            extra-substituters = https://neohaskell.cachix.org?priority=30 https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/download-artifact@v8
        with:
          name: dist-newstyle
          path: dist-newstyle
      - name: Run nhcore-test-auth
        run: LOG_LEVEL=Warn nix develop .#ci --command cabal test nhcore-test-auth nhcore-test-auth-dns

  test-integration:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.24.0
        with:
          extra-conf: |
            accept-flake-config = true
            http2 = false
            extra-substituters = https://neohaskell.cachix.org?priority=30 https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/download-artifact@v8
        with:
          name: dist-newstyle
          path: dist-newstyle
      - name: Run nhcore-test-integration
        run: LOG_LEVEL=Warn nix develop .#ci --command cabal test nhcore-test-integration

  test-service:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.24.0
        with:
          extra-conf: |
            accept-flake-config = true
            http2 = false
            extra-substituters = https://neohaskell.cachix.org?priority=30 https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/download-artifact@v8
        with:
          name: dist-newstyle
          path: dist-newstyle
      - name: Start PostgreSQL
        run: |
          docker run -d --name neohaskell_postgres \
            -e POSTGRES_USER=neohaskell \
            -e POSTGRES_PASSWORD=neohaskell \
            -e POSTGRES_DB=neohaskell \
            -p 5432:5432 \
            postgres:16-alpine \
            postgres -c max_connections=200
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -U neohaskell && break || sleep 1
          done
          if ! pg_isready -h 127.0.0.1 -U neohaskell; then
            echo "::error::PostgreSQL failed to start within 30 seconds"
            exit 1
          fi
        env:
          PGPASSWORD: neohaskell
      - name: Run nhcore-test-service
        env:
          POSTGRES_AVAILABLE: "true"
        run: LOG_LEVEL=Warn ./.agents/skills/neohaskell-test/scripts/nix-acquisition-diagnostics nix develop .#ci --command cabal test nhcore-test-service --test-show-details=direct
      - name: Run Erasable key store examples
        run: |
          private_db="nh_cryptoerasure_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          docker exec neohaskell_postgres createdb -U neohaskell "$private_db"
          CRYPTOERASURE_TEST_DB="$private_db" LOG_LEVEL=Warn nix develop .#ci --command .agents/skills/tdd/scripts/test-match --builddir "$RUNNER_TEMP/erasable-build" --transcript "$RUNNER_TEMP/erasable-service.log" 'Erasable key store' nhcore-test-service
          grep -F 'summary: 10 examples, 0 failures' "$RUNNER_TEMP/erasable-service.log"
      - name: Check entity event compiler rejections
        run: nix develop .#ci --command python3 core/test/Service/Event/check_compiler_rejections.py

  test-hurl:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.24.0
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/download-artifact@v8
        with:
          name: dist-newstyle
          path: dist-newstyle
      - name: Restore executable permissions
        run: find dist-newstyle/build -type f \( -name 'nhtestbed' -o -name 'nhoauthtestbed' \) -exec chmod +x {} +
      - name: Start PostgreSQL
        run: |
          docker run -d --name neohaskell_postgres \
            -e POSTGRES_USER=neohaskell \
            -e POSTGRES_PASSWORD=neohaskell \
            -e POSTGRES_DB=neohaskell \
            -p 5432:5432 \
            postgres:16-alpine \
            postgres -c max_connections=200
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -U neohaskell && break || sleep 1
          done
          if ! pg_isready -h 127.0.0.1 -U neohaskell; then
            echo "::error::PostgreSQL failed to start within 30 seconds"
            exit 1
          fi
        env:
          PGPASSWORD: neohaskell
      - name: Install hurl (pinned binary + checksum)
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 120 --retry-max-time 300 \
            -o hurl.deb \
            https://github.com/Orange-OpenSource/hurl/releases/download/6.0.0/hurl_6.0.0_amd64.deb
          echo "2686f605adfdceca18579a941b317262a4185915e6fda1f8deaab201da22e9cf  hurl.deb" | sha256sum -c -
          sudo dpkg -i hurl.deb
      - name: Install poppler-utils (for PDF extraction tests)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: neohaskell
          CRYPTOERASURE_FAULT_TESTS: "1"
          TESTBED_FAULT_HTTP_PORT: "19153"
          TESTBED_FAULT_FIXTURE_PORT: "19154"
        run: nix develop --command ./testbed/scripts/run-tests.sh
      - name: Prove cold-start health stays flat through 100k events
        run: nix develop --command ./testbed/scripts/cold-start-readiness.sh

  ci-gate:
    if: always()
    needs: [changes, build, test-core, test-transport, test-auth, test-integration, test-service, test-hurl]
    runs-on: ubuntu-latest
    steps:
      - name: Check all tests passed
        env:
          RUN_EXPENSIVE: ${{ needs.changes.outputs.run_expensive }}
          COMPILED: ${{ needs.changes.outputs.compiled }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::changes-detection job did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          allow_skip=false
          if [[ "$RUN_EXPENSIVE" != "true" || "$COMPILED" != "true" ]]; then
            allow_skip=true
          fi
          results=(
            "build=${{ needs.build.result }}"
            "test-core=${{ needs.test-core.result }}"
            "test-transport=${{ needs.test-transport.result }}"
            "test-auth=${{ needs.test-auth.result }}"
            "test-integration=${{ needs.test-integration.result }}"
            "test-service=${{ needs.test-service.result }}"
            "test-hurl=${{ needs.test-hurl.result }}"
          )
          for entry in "${results[@]}"; do
            job="${entry%%=*}"; r="${entry#*=}"
            if [[ "$r" == "skipped" && "$allow_skip" == "true" ]]; then
              continue
            fi
            if [[ "$r" != "success" ]]; then
              echo "::error::$job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "ci-gate: all build/test jobs passed (or correctly skipped by event and path selection)"
