name: Neo Release

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: neo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guidance:
    name: Verify source-owned agent guidance
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
      - run: .agents/skills/neohaskell-consumer-verification/scripts/agent-docs-ci

  build:
    needs: guidance
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
      - name: Validate source-owned agent guidance
        run: nix develop --command .agents/skills/neohaskell-consumer-verification/scripts/agent-docs-check
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neo
          key: ${{ matrix.target }}
      - name: Build the portable native binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --manifest-path neo/Cargo.toml --target "$TARGET"
      - name: Portability gate (no /nix/store references)
        env:
          TARGET: ${{ matrix.target }}
        run: ./.agents/skills/neohaskell-release/scripts/neo-release inspect "neo/target/${TARGET}/release/neo" "$TARGET"
      - name: Package + checksum the native asset
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ./.agents/skills/neohaskell-release/scripts/neo-release package "$TARGET" "neo/target/${TARGET}/release/neo" artifacts
          ./.agents/skills/neohaskell-release/scripts/neo-release checksums artifacts
      - name: Native install + smoke
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ./.agents/skills/neohaskell-release/scripts/neo-release install artifacts "$TARGET" "$RUNNER_TEMP/neo-smoke/neo"
          "$RUNNER_TEMP/neo-smoke/neo" --version
      - uses: actions/upload-artifact@v7
        with:
          name: neo-${{ matrix.target }}
          path: |
            artifacts/neo-${{ matrix.target }}
          if-no-files-found: error
