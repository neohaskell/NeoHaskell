name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks, deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks (pinned + checksum)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks dir . --redact --no-banner --exit-code 1

  adr-index:
    name: adr index (decisions README faithful)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .agents/skills/technical-writing/scripts/adr-index-check.py

  release-check:
    name: release fragment check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check release fragments and generated provenance
        env:
          BASE_REF: ${{ github.base_ref }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_PR_BODY: ${{ github.event.pull_request.body }}
        run: ./.agents/skills/neohaskell-release/scripts/semantic-release check --base "origin/${BASE_REF}"

  tooling:
    name: owned tooling checks
    needs: agent-guidance-evidence
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require agent guidance evidence
        env:
          EVIDENCE_RESULT: ${{ needs.agent-guidance-evidence.result }}
        run: test "$EVIDENCE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - name: Validate skill metadata and owned links
        run: python3 .agents/skills/validate-skills/scripts/check.py --repo .
      - name: Validate source-owned agent guidance
        run: nix develop --command .agents/skills/neohaskell-consumer-verification/scripts/agent-docs-check

      - name: Run owned Python fixtures
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r -d '' test_file; do
            found=true
            printf 'Running %s\n' "$test_file"
            python3 "$test_file"
          done < <(find .agents/skills -type f -path '*/tests/test_*.py' -print0 | sort -z)
          if [ "$found" != true ]; then
            echo "::error::No owned Python tests were found"
            exit 1
          fi
      - name: Test worktree cleanup audit helper
        run: python3 .agents/skills/worktree-cleanup/scripts/test_worktree_audit.py
      - name: Run offline release checks
        run: env -u GH_TOKEN -u GITHUB_TOKEN ./.agents/skills/neohaskell-release/scripts/semantic-release --self-test
      - name: Run Node 24 orchestration and plan checks
        run: |
          nix shell .#legacyPackages.x86_64-linux.nodejs_24 --command bash -euo pipefail -c '
            node -e '\''const [major, minor] = process.versions.node.split(".").map(Number); if (major < 24 || (major === 24 && minor < 2)) process.exit(1)'\''
            npm install --prefix .agents/skills/orchestrate/scripts --ignore-scripts --no-audit --no-fund --no-package-lock
            npm --prefix .agents/skills/orchestrate/scripts test
            npm --prefix .agents/skills/orchestrate/scripts run typecheck
            node --test .agents/skills/multi-phase-plan/scripts/check-plan.test.mjs
          '

  agent-guidance-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
      - run: .agents/skills/neohaskell-consumer-verification/scripts/agent-docs-ci

  lint:
    name: hlint (dialect gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hlint 3.10 (pinned binary + checksum)
        run: |
          curl -sSfL -o hlint.tar.gz \
            https://github.com/ndmitchell/hlint/releases/download/v3.10/hlint-3.10-x86_64-linux.tar.gz
          echo "ccabc8802a58154699a3583b8dddc5ea2e6d65753a62c45c0e80088ebb16b42b  hlint.tar.gz" | sha256sum -c -
          tar xzf hlint.tar.gz
      - name: Run HLint with the repository configuration
        run: ./hlint-3.10/hlint core integrations testbed
