name: Installer CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: installer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.detect.outputs.touched }}
      run_expensive: ${{ steps.detect.outputs.run_expensive }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          FULL_CI_LABEL_PRESENT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
        run: |
          set -euo pipefail
          run_expensive=true
          if [ "$EVENT" = "pull_request" ]; then
            run_expensive=false
            if [ "$IS_DRAFT" != "true" ] || [ "$FULL_CI_LABEL_PRESENT" = "true" ]; then
              run_expensive=true
            fi
          fi
          echo "run_expensive=$run_expensive" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "pull_request" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          PATTERN='^(installer/|scripts/releases/|\.agents/skills/neohaskell-release/(references/(config|manifest)\.json|scripts/releases/|scripts/(semantic-release|neo-release)$)|\.github/workflows/(installer-ci|semantic-release|neo-release)\.yml$)'
          if echo "$CHANGED" | grep -qE "$PATTERN"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: >-
      needs.changes.outputs.run_expensive == 'true'
      && needs.changes.outputs.touched == 'true'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    needs: changes
    if: >-
      needs.changes.outputs.run_expensive == 'true'
      && needs.changes.outputs.touched == 'true'
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - run: cargo test --locked --all-features

  build:
    needs: changes
    if: >-
      needs.changes.outputs.run_expensive == 'true'
      && needs.changes.outputs.touched == 'true'
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: installer
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cross
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package the native asset
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "target/${TARGET}/release/neo-install" "artifacts/installer-neo-install-${TARGET}"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-neo-install-${{ matrix.target }}
          path: |
            installer/artifacts/installer-neo-install-${{ matrix.target }}
          if-no-files-found: error

  installer-ci-gate:
    if: always()
    needs: [changes, lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all installer jobs passed (or correctly skipped)
        env:
          RUN_EXPENSIVE: ${{ needs.changes.outputs.run_expensive }}
          TOUCHED: ${{ needs.changes.outputs.touched }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::changes-detection job did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          allow_skip=false
          if [[ "$RUN_EXPENSIVE" != "true" || "$TOUCHED" != "true" ]]; then
            allow_skip=true
          fi
          results=(
            "lint=${{ needs.lint.result }}"
            "test=${{ needs.test.result }}"
            "build=${{ needs.build.result }}"
          )
          for entry in "${results[@]}"; do
            job="${entry%%=*}"; r="${entry#*=}"
            if [[ "$r" == "skipped" && "$allow_skip" == "true" ]]; then
              continue
            fi
            if [[ "$r" != "success" ]]; then
              echo "::error::$job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "installer-ci-gate: all installer jobs passed (or correctly skipped by event and path selection)"
