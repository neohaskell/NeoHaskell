name: "Neo CLI"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main, integration/neo-monorepo]
    paths:
      - "neo/**"
      - "docs/agent/**"
      - "nix/neo-package.nix"
      - "flake.nix"
      - "flake.lock"
      - ".agents/skills/neohaskell-release/scripts/neo-release"
      - ".agents/skills/neohaskell-release/scripts/cache-prime"
      - ".agents/skills/neohaskell-consumer-verification/**"
      - ".github/workflows/neo-ci.yml"

permissions:
  contents: read

concurrency:
  group: neo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.detect.outputs.touched }}
      run_expensive: ${{ steps.detect.outputs.run_expensive }}
      contract: ${{ steps.detect.outputs.contract }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          FULL_CI_LABEL_PRESENT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-full-ci') }}
        run: |
          set -euo pipefail
          run_expensive=true
          if [ "$EVENT" = "pull_request" ]; then
            run_expensive=false
            if [ "$IS_DRAFT" != "true" ] || [ "$FULL_CI_LABEL_PRESENT" = "true" ]; then
              run_expensive=true
            fi
          fi
          echo "run_expensive=$run_expensive" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "contract=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          PATTERN='^(neo/|docs/agent/|nix/neo-package\.nix|flake\.nix|flake\.lock|\.agents/skills/neohaskell-release/scripts/(neo-release|cache-prime)$|\.agents/skills/neohaskell-consumer-verification/|\.github/workflows/neo-ci\.yml)'
          CONTRACT='^(neo/|core/|integrations/|docs/agent/|nix/neo-package\.nix|flake\.nix|flake\.lock|\.agents/skills/neohaskell-release/scripts/(neo-release|cache-prime)$|\.agents/skills/neohaskell-consumer-verification/|\.github/workflows/neo-ci\.yml)'
          if echo "$CHANGED" | grep -qE "$PATTERN"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE "$CONTRACT"; then
            echo "contract=true" >> "$GITHUB_OUTPUT"
          else
            echo "contract=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: changes
    if: >-
      needs.changes.outputs.run_expensive == 'true'
      && needs.changes.outputs.touched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Unit tests (all in-crate binary tests, --bins)
        run: nix develop ./neo -c cargo test --manifest-path neo/Cargo.toml --locked --bins
      - name: rustfmt (report-only baseline)
        continue-on-error: true
        run: |
          nix develop ./neo -c cargo fmt --manifest-path neo/Cargo.toml --check \
            | tee "$GITHUB_STEP_SUMMARY" || true
      - name: clippy (report-only baseline)
        continue-on-error: true
        run: |
          nix develop ./neo -c cargo clippy --manifest-path neo/Cargo.toml 2>&1 \
            | tee clippy.log || true
          count=$(grep -cE '^warning:' clippy.log || true)
          echo "clippy baseline: ${count} warning(s) in neo product code (not fixed in this packaging PR)" \
            >> "$GITHUB_STEP_SUMMARY"

  ide:
    needs: changes
    if: >-
      needs.changes.outputs.run_expensive == 'true'
      && needs.changes.outputs.touched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Install from lockfile
        run: |
          nix develop ./neo -c bash -c '
            set -euo pipefail
            cd neo/assets/ide
            npm ci
          '
      - name: Frontend tests (report-only imported baseline)
        continue-on-error: true
        run: |
          nix develop ./neo -c bash -c 'cd neo/assets/ide && npx vitest run' 2>&1 \
            | tee "$GITHUB_STEP_SUMMARY"
      - name: eslint (report-only baseline)
        continue-on-error: true
        run: |
          nix develop ./neo -c bash -c 'cd neo/assets/ide && npm run lint' 2>&1 \
            | tee "$GITHUB_STEP_SUMMARY" || true
      - name: Bundle comparator fixture self-test
        run: ./.agents/skills/neohaskell-consumer-verification/scripts/neo-dist-check --self-test
      - name: Production build matches committed bundle
        run: ./.agents/skills/neohaskell-consumer-verification/scripts/neo-dist-check

  nix-package:
    needs: changes
    if: >-
      needs.changes.outputs.run_expensive == 'true'
      && needs.changes.outputs.touched == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
          - runner: macos-latest
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build the flake package (runs the in-crate unit tests as checkPhase)
        run: nix build .#neo --print-build-logs
      - name: Smoke the built binary
        run: |
          ./result/bin/neo --version
          ./result/bin/neo --help
      - name: Smoke the flake app
        run: nix run .#neo -- --version

  consumer-contract:
    needs: changes
    if: >-
      needs.changes.outputs.run_expensive == 'true'
      && needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REHEARSAL_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neo
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Self-test the contract orchestration logic (timeout, cleanup, quoting, readiness)
        run: ./.agents/skills/neohaskell-consumer-verification/scripts/neo-consumer-contract --self-test
      - name: Release asset contract self-test
        run: ./.agents/skills/neohaskell-release/scripts/neo-release --self-test
      - name: Default-cache closure self-test
        run: ./.agents/skills/neohaskell-release/scripts/cache-prime --self-test
      - name: Build portable binary, gate portability, verify + install
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path neo/Cargo.toml --target "$REHEARSAL_TARGET"
          ./.agents/skills/neohaskell-release/scripts/neo-release inspect "neo/target/${REHEARSAL_TARGET}/release/neo" "$REHEARSAL_TARGET"
          ./.agents/skills/neohaskell-release/scripts/neo-release package "$REHEARSAL_TARGET" "neo/target/${REHEARSAL_TARGET}/release/neo" "$RUNNER_TEMP/neo-artifacts"
          ./.agents/skills/neohaskell-release/scripts/neo-release checksums "$RUNNER_TEMP/neo-artifacts"
          ./.agents/skills/neohaskell-release/scripts/neo-release install "$RUNNER_TEMP/neo-artifacts" "$REHEARSAL_TARGET" "$RUNNER_TEMP/neo-bin/neo"
          echo "NEO_BIN=$RUNNER_TEMP/neo-bin/neo" >> "$GITHUB_ENV"
      - name: Run the generated-project consumer contract against the installed artifact
        env:
          CONTRACT_BUILD_TIMEOUT: "5400"
          CONTRACT_TEST_TIMEOUT: "2400"
          CONTRACT_READY_DEADLINE: "300"
        run: ./.agents/skills/neohaskell-consumer-verification/scripts/neo-consumer-contract

  cache-populate:
    needs: changes
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration/neo-monorepo')
      && github.repository == 'neohaskell/NeoHaskell'
      && needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      REHEARSAL_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Honest skip when no token is configured
        if: ${{ env.CACHIX_AUTH_TOKEN == '' }}
        run: echo "No CACHIX_AUTH_TOKEN configured — skipping cache population (not a failure)."
      - uses: actions/checkout@v7.0.1
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.94.0
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          workspaces: neo
      - uses: DeterminateSystems/determinate-nix-action@v3.23.3
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          extra-conf: |
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
      - name: Configure Cachix push
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: neohaskell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Populate the cache from the EXACT consumer path + the default released closure
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        env:
          CONTRACT_BUILD_TIMEOUT: "5400"
          CONTRACT_TEST_TIMEOUT: "2400"
          CONTRACT_READY_DEADLINE: "300"
          PRIME_BUILD_TIMEOUT: "5400"
          PRIME_TEST_TIMEOUT: "2400"
          PRIME_RUN_TIMEOUT: "30"
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path neo/Cargo.toml --target "$REHEARSAL_TARGET"
          ./.agents/skills/neohaskell-release/scripts/neo-release inspect "neo/target/${REHEARSAL_TARGET}/release/neo" "$REHEARSAL_TARGET"
          ./.agents/skills/neohaskell-release/scripts/neo-release package "$REHEARSAL_TARGET" "neo/target/${REHEARSAL_TARGET}/release/neo" "$RUNNER_TEMP/neo-artifacts"
          ./.agents/skills/neohaskell-release/scripts/neo-release checksums "$RUNNER_TEMP/neo-artifacts"
          ./.agents/skills/neohaskell-release/scripts/neo-release install "$RUNNER_TEMP/neo-artifacts" "$REHEARSAL_TARGET" "$RUNNER_TEMP/neo-bin/neo"
          NEO_BIN="$RUNNER_TEMP/neo-bin/neo" ./.agents/skills/neohaskell-consumer-verification/scripts/neo-consumer-contract
          NEO_BIN="$RUNNER_TEMP/neo-bin/neo" ./.agents/skills/neohaskell-release/scripts/cache-prime

  neo-ci-gate:
    if: always()
    needs: [changes, rust, ide, nix-package, consumer-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Check all neo jobs passed (or correctly skipped)
        env:
          RUN_EXPENSIVE: ${{ needs.changes.outputs.run_expensive }}
          TOUCHED: ${{ needs.changes.outputs.touched }}
          CONTRACT: ${{ needs.changes.outputs.contract }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::changes-detection job did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          allow_skip_component=false
          if [[ "$RUN_EXPENSIVE" != "true" || "$TOUCHED" != "true" ]]; then
            allow_skip_component=true
          fi
          allow_skip_contract=false
          if [[ "$RUN_EXPENSIVE" != "true" || "$CONTRACT" != "true" ]]; then
            allow_skip_contract=true
          fi
          results=(
            "rust=${{ needs.rust.result }}=$allow_skip_component"
            "ide=${{ needs.ide.result }}=$allow_skip_component"
            "nix-package=${{ needs.nix-package.result }}=$allow_skip_component"
            "consumer-contract=${{ needs.consumer-contract.result }}=$allow_skip_contract"
          )
          for entry in "${results[@]}"; do
            job="${entry%%=*}"; rest="${entry#*=}"
            r="${rest%%=*}"; may_skip="${rest#*=}"
            if [[ "$r" == "skipped" && "$may_skip" == "true" ]]; then
              continue
            fi
            if [[ "$r" != "success" ]]; then
              echo "::error::$job did not pass (result: $r)"
              exit 1
            fi
          done
          echo "neo-ci-gate: all neo jobs passed (or correctly skipped by event and path selection)"
