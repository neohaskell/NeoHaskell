name: nightly-bench

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://cache.iog.io https://neohaskell.cachix.org
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= neohaskell.cachix.org-1:mo2cLaGbwqbrxs9xhqKK8jeNsn3osi7t6XoAmxSZssc=
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-
      - name: Prepare benchmark evidence directory
        run: mkdir -p .agents-state/framework-benchmark
      - name: Start PostgreSQL
        run: |
          docker run -d --name neohaskell_postgres \
            -e POSTGRES_USER=neohaskell \
            -e POSTGRES_PASSWORD=neohaskell \
            -e POSTGRES_DB=neohaskell \
            -p 5432:5432 \
            postgres:16-alpine \
            postgres -c max_connections=200
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -U neohaskell && break || sleep 1
          done
          if ! pg_isready -h 127.0.0.1 -U neohaskell; then
            echo "::error::PostgreSQL failed to start within 30 seconds"
            exit 1
          fi
        env:
          PGPASSWORD: neohaskell
      - name: Run bounded Hspec suite measurements
        run: LOG_LEVEL=Warn POSTGRES_AVAILABLE=true python3 .agents/skills/framework-benchmark/scripts/bench.py --strict
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: framework-benchmark-${{ github.run_id }}
          path: .agents-state/framework-benchmark/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
