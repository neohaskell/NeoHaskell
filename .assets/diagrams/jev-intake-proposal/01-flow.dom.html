px; font-family: Helvetica; color: light-dark(#263449, #b7c3d5); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Code / lookup</div></div></div></foreignObject></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="940" y="1900" width="20" height="20" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"></rect></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="970" y="1895" width="255" height="30" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"></rect><rect x="970" y="1895" width="255" height="30" fill="none" stroke="none" pointer-events="all"></rect></g><g style=""><g><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%"><div style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 253px; height: 1px; padding-top: 1910px; margin-left: 972px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #263449; "><div style="display: inline-block; font-size: 16px; font-family: Helvetica; color: light-dark(#263449, #b7c3d5); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Human / LLM fallback</div></div></div></foreignObject></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="1240" y="1900" width="20" height="20" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"></rect></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="1270" y="1895" width="255" height="30" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"></rect><rect x="1270" y="1895" width="255" height="30" fill="none" stroke="none" pointer-events="all"></rect></g><g style=""><g><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%"><div style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 253px; height: 1px; padding-top: 1910px; margin-left: 1272px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #263449; "><div style="display: inline-block; font-size: 16px; font-family: Helvetica; color: light-dark(#263449, #b7c3d5); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Typed handoff</div></div></div></foreignObject></g></g><g transform="translate(0.5,0.5)" style="visibility: visible;"><rect x="40" y="1945" width="1520" height="45" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"></rect><rect x="40" y="1945" width="1520" height="45" fill="none" stroke="none" pointer-events="all"></rect></g><g style=""><g><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%"><div style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 1518px; height: 1px; padding-top: 1968px; margin-left: 42px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #263449; "><div style="display: inline-block; font-size: 14px; font-family: Helvetica; color: light-dark(#263449, #b7c3d5); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Proposed from the TypeSafe skill + fan-out / intent-routing patterns. Budgeted fallback and task presets are design choices; no speed or accuracy claim is implied.</div></div></div></foreignObject></g></g></g><g></g><g></g></g></svg></div><script>var graph=new mxGraph(document.getElementById('graph'));graph.setHtmlLabels(true);graph.setEnabled(false);var doc=mxUtils.parseXml("<?xml version='1.0' encoding='utf-8'?>\n<mxfile host=\"drawio\" version=\"26.0.0\"><diagram id=\"01-flow\" name=\"Proposed intake \u00b7 code in control, Jev for meaning\">\n    <mxGraphModel grid=\"1\" gridSize=\"10\" page=\"1\" pageWidth=\"1600\" pageHeight=\"2010\" background=\"#ffffff\">\n      <root>\n        <mxCell id=\"0\" />\n        <mxCell id=\"1\" parent=\"0\" />\n        <mxCell id=\"title\" value=\"Proposed intake \u00b7 code in control, Jev for meaning\" style=\"text;html=1;whiteSpace=wrap;align=left;verticalAlign=middle;fontFamily=Helvetica;fontSize=34;fontColor=#263449;fillColor=none;strokeColor=none;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"40\" y=\"25\" width=\"1520\" height=\"60\" />\n        </mxCell>\n        <mxCell id=\"sub\" value=\"REVIEW DRAFT \u00b7 A design proposal, not implemented behavior. Zero or a small bounded number of Jev calls; LLM fallback only for a named gap.\" style=\"text;html=1;whiteSpace=wrap;align=left;verticalAlign=middle;fontFamily=Helvetica;fontSize=19;fontColor=#263449;fillColor=none;strokeColor=none;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"40\" y=\"90\" width=\"1520\" height=\"45\" />\n        </mxCell>\n        <mxCell id=\"request\" value=\"&lt;b style=&quot;font-size:21px&quot;&gt;Request + existing session&lt;/b&gt;&lt;div style=&quot;font-size:17px;line-height:1.35;margin-top:8px&quot;&gt;Keep explicit task settings and user constraints.&lt;/div&gt;\" style=\"rounded=1;arcSize=10;whiteSpace=wrap;html=1;spacing=18;align=left;verticalAlign=middle;fontFamily=Helvetica;fontSize=17;fontColor=#172b42;fillColor=#d5e8d4;strokeColor=#82b366;strokeWidth=2;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"580\" y=\"165\" width=\"460\" height=\"85\" />\n        </mxCell>\n        <mxCell id=\"facts\" value=\"&lt;b style=&quot;font-size:21px&quot;&gt;CODE \u00b7 Read facts; lock constraints&lt;/b&gt;&lt;div style=&quot;font-size:17px;line-height:1.35;margin-top:8px&quot;&gt;Source: issue / ad hoc / saved session.&lt;br&gt;Branch, worktree, run state, IDs and budget.&lt;br&gt;Explicit pause takes priority over new work.&lt;/div&gt;\" style=\"rounded=1;arcSize=10;whiteSpace=wrap;html=1;spacing=18;align=left;verticalAlign=middle;fontFamily=Helvetica;fontSize=17;fontColor=#172b42;fillColor=#dae8fc;strokeColor=#6c8ebf;strokeWidth=2;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"580\" y=\"305\" width=\"460\" height=\"120\" />\n        </mxCell>\n        <mxCell id=\"explicit\" value=\"&lt;span style=&quot;font-size:12px&quot;&gt;TOOL&lt;/span&gt;&lt;br&gt;&lt;b&gt;Required intent / mode&lt;br&gt;already explicit?&lt;/b&gt;\" style=\"shape=rhombus;perimeter=rhombusPerimeter;whiteSpace=wrap;html=1;align=center;verticalAlign=middle;fontFamily=Helvetica;fontSize=18;fontColor=#172b42;fillColor=#fff2cc;strokeColor=#d6b656;strokeWidth=2;spacing=2;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"610\" y=\"475\" width=\"400\" height=\"150\" />\n        </mxCell>\n        <mxCell id=\"batch-a\" value=\"&lt;b style=&quot;font-size:21px&quot;&gt;JEV A \u00b7 Fill unresolved intent slots&lt;/b&gt;&lt;div style=&quot;font-size:17px;line-height:1.35;margin-top:8px&quot;&gt;CHOICE: primary work type and execution mode.&lt;br&gt;NOUL: additional requested actions / mixed work.&lt;br&gt;Never overwrite an explicit setting.&lt;/div&gt;\" style=\"rounded=1;arcSize=10;whiteSpace=wrap;html=1;spacing=18;align=left;verticalAlign=middle;fontFamily=Helvetica;fontSize=17;fontColor=#172b42;fillColor=#e1d5e7;strokeColor=#9673a6;strokeWidth=2;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"580\" y=\"700\" width=\"460\" height=\"125\" />\n        </mxCell>\n        <mxCell id=\"lookup\" value=\"&lt;b style=&quot;font-size:21px&quot;&gt;CODE \u00b7 Load the matching playbook&lt;/b&gt;&lt;div style=&quot;font-size:17px;line-height:1.35;margin-top:8px&quot;&gt;Retrieve only its required facts and candidates.&lt;br&gt;Code paths, skill IDs, checkpoints, logs or PRs.&lt;br&gt;Operational tasks need no code localization.&lt;/div&gt;\" style=\"rounded=1;arcSize=10;whiteSpace=wrap;html=1;spacing=18;align=left;verticalAlign=middle;fontFamily=Helvetica;fontSize=17;fontColor=#172b42;fillColor=#dae8fc;strokeColor=#6c8ebf;strokeWidth=2;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"580\" y=\"905\" width=\"460\" height=\"130\" />\n        </mxCell>\n        <mxCell id=\"batch-b\" value=\"&lt;b style=&quot;font-size:21px&quot;&gt;JEV B \u00b7 Judge retrieved candidates&lt;/b&gt;&lt;div style=&quot;font-size:17px;line-height:1.35;margin-top:8px&quot;&gt;NOUL: does each candidate apply?&lt;br&gt;SCORE: evidence fit for each candidate.&lt;br&gt;CHOICE: known next action or missing field.&lt;/div&gt;\" style=\"rounded=1;arcSize=10;whiteSpace=wrap;html=1;spacing=18;align=left;verticalAlign=middle;fontFamily=Helvetica;fontSize=17;fontColor=#172b42;fillColor=#e1d5e7;strokeColor=#9673a6;strokeWidth=2;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"580\" y=\"1110\" width=\"460\" height=\"130\" />\n        </mxCell>\n        <mxCell id=\"usable\" value=\"&lt;span style=&quot;font-size:12px&quot;&gt;TOOL&lt;/span&gt;&lt;br&gt;&lt;b&gt;Required fields resolved&lt;br&gt;and checks pass?&lt;/b&gt;\" style=\"shape=rhombus;perimeter=rhombusPerimeter;whiteSpace=wrap;html=1;align=center;verticalAlign=middle;fontFamily=Helvetica;fontSize=18;fontColor=#172b42;fillColor=#fff2cc;strokeColor=#d6b656;strokeWidth=2;spacing=2;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"610\" y=\"1320\" width=\"400\" height=\"150\" />\n        </mxCell>\n        <mxCell id=\"brief\" value=\"&lt;b style=&quot;font-size:21px&quot;&gt;CODE \u00b7 Compile an intake record&lt;/b&gt;&lt;div style=&quot;font-size:17px;line-height:1.35;margin-top:8px&quot;&gt;Task + mode + ordered actions + targets.&lt;br&gt;Evidence references, stop rules and budgets.&lt;/div&gt;\" style=\"rounded=1;arcSize=10;whiteSpace=wrap;html=1;spacing=18;align=left;verticalAlign=middle;fontFamily=Helvetica;fontSize=17;fontColor=#172b42;fillColor=#d5e8d4;strokeColor=#82b366;strokeWidth=2;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"580\" y=\"1555\" width=\"460\" height=\"110\" />\n        </mxCell>\n        <mxCell id=\"dispatch\" value=\"&lt;b style=&quot;font-size:21px&quot;&gt;CODE \u00b7 Run a registered playbook&lt;/b&gt;&lt;div style=&quot;font-size:17px;line-height:1.35;margin-top:8px&quot;&gt;Tools handle known steps and state transitions.&lt;br&gt;Invoke an LLM only for a step needing&lt;br&gt;new code, prose, planning or diagnosis.&lt;/div&gt;\" style=\"rounded=1;arcSize=10;whiteSpace=wrap;html=1;spacing=18;align=left;verticalAlign=middle;fontFamily=Helvetica;fontSize=17;fontColor=#172b42;fillColor=#dae8fc;strokeColor=#6c8ebf;strokeWidth=2;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"580\" y=\"1745\" width=\"460\" height=\"130\" />\n        </mxCell>\n        <mxCell id=\"gap\" value=\"&lt;span style=&quot;font-size:12px&quot;&gt;TOOL&lt;/span&gt;&lt;br&gt;&lt;b&gt;What is unresolved?&lt;/b&gt;\" style=\"shape=rhombus;perimeter=rhombusPerimeter;whiteSpace=wrap;html=1;align=center;verticalAlign=middle;fontFamily=Helvetica;fontSize=18;fontColor=#172b42;fillColor=#fff2cc;strokeColor=#d6b656;strokeWidth=2;spacing=2;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry as=\"geometry\" x=\"60\" y=\"1320\" width=\"350\" height=\"150\" />\n        </mxCell>\n        <mxCell id=\"fetch\" value=\"&lt;b style=&quot;font-size:21px&quot;&gt;Missing observable evidence&lt;/b&gt;&lt;div style=&quot;font-size:17px;line-height:1.35;margin-top:8px&quot;&gt;Fetch the named source, once within budget.&lt;br&gt;Rejudge only affected questions;&lt;br&gt;if still unresolved, clarify or escalate.&lt;/div&gt;\" style=\"rounded=1;arcSize=10;whiteSpace=wrap;html=1;spacing=18;align=left;verticalAlign=middle;fontFamily=Helvetica;fontSize=17;fontColor=#1
