# Repository-informed task categories; descriptive, not prescriptive.
name: "NeoHaskell repository task taxonomy"
description: "An intent-first tree of possible requests to an AI agent working with this repository. Categories describe work that could be requested, not a claim that every capability is implemented or every task is needed."
classification_notes:
  - "The category tree expresses kinds of work, not a fixed work breakdown. A concrete task may contain subtasks classified anywhere in this tree."
  - "Choose the deepest category matching the primary requested outcome. A compound request may span several categories."
  - "Investigation, review, planning, and verification are first-class tasks and do not inherently require edits."
  - "Component-specific branches provide detail without repeating every component under every generic task type. For example, an OAuth defect belongs under defect repair, an OAuth audit under security assessment, and a new OAuth provider under implementation."
  - "This is an extensible taxonomy, not an exhaustive enumeration of future requests, an execution policy, or an authorization to perform actions."
  - "The public website is external. Placeholder IDE views and other proposed extensions are potential work, not assertions of current functionality."
evidence_basis:
  - "Direct inspection of tracked source, test, script, workflow, and design-record inventories."
  - "Representative implementation reads including neo/src/cli.rs, neo/src/ide/sync.rs, neo/assets/ide/src/App.tsx, and .github/workflows/neo-ci.yml."
  - "Package and boundary checks including neo/assets/ide/package.json and website/README.md."
task_composition:
  name: "Tasks, parent tasks, and subtasks"
  description: "Apply this model to every category. Task size and position in a work breakdown are independent of task category."
  rules:
    - "Any category can classify a standalone task, a parent task, or a subtask. A leaf category does not imply an indivisible task."
    - "Classify a parent by its requested outcome and each subtask by its own outcome; children do not have to share the parent category or category ancestry."
    - "A parent can have arbitrarily nested subtasks. Decompose only when the child has a distinct outcome, deliverable, or verification boundary."
    - "Parent-child containment means contributes to this outcome; depends_on means requires this other task. Containment alone does not impose execution order."
    - "Parent completion requires its own acceptance criteria and all required subtasks; completing some subtasks does not automatically satisfy the parent."
    - "Use one primary parent per task to keep the work breakdown a tree. Reference a shared prerequisite through depends_on instead of duplicating it under multiple parents."
    - "These examples illustrate possible decompositions, not mandatory workflows. Investigation may conclude that no implementation is warranted."
  task_fields:
    id: "Unique task identifier, independent of its category."
    name: "Concrete requested outcome."
    description: "Scope and intended result of this task."
    category_path: "Ordered names from a top-level taxonomy category to the selected category."
    acceptance_criteria: "Observable conditions defining completion, including any parent-level integration outcome."
    depends_on: "Identifiers of prerequisite tasks; these relationships are separate from containment."
    children: "Optional nested concrete tasks. Nesting establishes the parent relationship."
  examples:
    - id: "provider"
      name: "Add an OAuth provider"
      description: "Deliver a usable provider integration with compatible configuration and access behavior."
      category_path:
        - "Implement and extend capabilities"
        - "Service boundaries"
        - "Identity and access control"
      acceptance_criteria:
        - "The provider can complete the intended login flow and failures are handled without exposing secrets."
      children:
        - id: "provider-research"
          name: "Understand the existing provider extension point"
          description: "Identify the current provider contract and configuration flow."
          category_path:
            - "Understand and investigate"
            - "Locate behavior"
            - "Feature implementation tracing"
          acceptance_criteria:
            - "The relevant extension points and constraints are identified."
        - id: "provider-implementation"
          name: "Implement the provider"
          description: "Add configuration, protocol handling, and integration with the authentication subsystem."
          category_path:
            - "Implement and extend capabilities"
            - "Service boundaries"
            - "Identity and access control"
          acceptance_criteria:
            - "The provider implements the intended authentication contract."
          depends_on:
            - "provider-research"
          children:
            - id: "provider-tests"
              name: "Verify provider failure cases"
              description: "Exercise malformed responses, denied authorization, and expired credentials."
              category_path:
                - "Testing and verification"
                - "Behavioral test development"
                - "Regression tests"
              acceptance_criteria:
                - "Known failure cases have reproducible checks."
        - id: "provider-audit"
          name: "Review authentication boundaries"
          description: "Inspect token validation, callback handling, and secret exposure in the implementation."
          category_path:
            - "Review and audit"
            - "Security assessment"
            - "Authentication and authorization audit"
          acceptance_criteria:
            - "Findings are recorded and blocking issues are resolved."
          depends_on:
            - "provider-implementation"
        - id: "provider-docs"
          name: "Document provider configuration"
          description: "Explain required configuration and demonstrate a working setup."
          category_path:
            - "Documentation and knowledge transfer"
            - "User-facing explanation"
            - "API reference and examples"
          acceptance_criteria:
            - "The example matches the delivered provider configuration."
          depends_on:
            - "provider-implementation"
    - id: "projection-fix"
      name: "Repair stale query results after reconnect"
      description: "Restore complete projection updates after a subscription disconnect."
      category_path:
        - "Diagnose and repair defects"
        - "Runtime correctness defects"
        - "Persistence and projection defects"
      acceptance_criteria:
        - "A disconnect and reconnect leaves the query results consistent with the authoritative event history."
      children:
        - id: "projection-repro"
          name: "Reproduce the missing updates"
          description: "Isolate an event sequence and disconnect window that produce stale results."
          category_path:
            - "Diagnose and repair defects"
            - "Reproduction and triage"
            - "Minimal reproducer"
          acceptance_criteria:
            - "The failure can be reproduced deterministically."
        - id: "projection-history"
          name: "Find when reconnect behavior changed"
          description: "Compare earlier implementations to identify the relevant behavioral change."
          category_path:
            - "Understand and investigate"
            - "Historical investigation"
            - "Regression bisection"
          acceptance_criteria:
            - "The introducing revision or bounded uncertainty is documented."
          depends_on:
            - "projection-repro"
        - id: "projection-repair"
          name: "Correct subscription catch-up"
          description: "Repair reconnect or checkpoint behavior at the identified boundary."
          category_path:
            - "Diagnose and repair defects"
            - "Runtime correctness defects"
            - "Concurrency and lifecycle defects"
          acceptance_criteria:
            - "Events from the disconnect window are processed correctly."
          depends_on:
            - "projection-repro"
        - id: "projection-verify"
          name: "Exercise database disconnect recovery"
          description: "Verify recovery with a real disconnect and compare resulting read models."
          category_path:
            - "Testing and verification"
            - "Adversarial and resilience verification"
            - "Fault-injection tests"
          acceptance_criteria:
            - "The corrected implementation survives the disconnect scenario."
          depends_on:
            - "projection-repair"
    - id: "feature-origin"
      name: "Explain where an IDE feature came from"
      description: "Produce a source-backed explanation of implementation and historical intent without assuming changes are needed."
      category_path:
        - "Understand and investigate"
        - "Historical investigation"
        - "Feature origin"
      acceptance_criteria:
        - "The explanation connects current behavior to implementation and historical evidence, with uncertainty stated."
      children:
        - id: "feature-location"
          name: "Trace the visible behavior"
          description: "Connect the browser interaction to frontend state, RPC, and backend behavior."
          category_path:
            - "Understand and investigate"
            - "Locate behavior"
            - "Feature implementation tracing"
          acceptance_criteria:
            - "The relevant execution path is identified."
        - id: "feature-rationale"
          name: "Recover the original rationale"
          description: "Read relevant history and decision records to explain the design choice."
          category_path:
            - "Understand and investigate"
            - "Historical investigation"
            - "Decision rationale"
          acceptance_criteria:
            - "The rationale is supported by historical evidence or marked unknown."
          depends_on:
            - "feature-location"
        - id: "feature-brief"
          name: "Write the explanation"
          description: "Summarize what the feature does, where it lives, and why it exists."
          category_path:
            - "Documentation and knowledge transfer"
            - "Maintainer knowledge"
            - "Handoffs and technical briefings"
          acceptance_criteria:
            - "The briefing cites the implementation and supporting history."
          depends_on:
            - "feature-location"
            - "feature-rationale"
children:
  - name: "Understand and investigate"
    description: "Answer questions about the repository without requiring a change."
    children:
      - name: "Repository orientation"
        description: "Establish what exists, what owns it, and how the pieces fit together."
        children:
          - name: "Package and subsystem map"
            description: "Explain the roles of nhcore, integrations, testbed, Neo CLI, installer, and supporting tooling."
          - name: "Execution and data flow"
            description: "Trace a request through transport, command handling, event persistence, entity reconstruction, and query projection."
          - name: "Local versus external ownership"
            description: "Determine whether work belongs here, in a generated application, or in an external repository such as website-v2."
          - name: "Current capability inventory"
            description: "Distinguish implemented behavior, placeholders, experiments, retired components, and proposed features."
      - name: "Locate behavior"
        description: "Find the code and contracts responsible for an observed capability."
        children:
          - name: "Feature implementation tracing"
            description: "Locate entry points, helpers, configuration, generated code, and tests implementing a named feature."
          - name: "API and usage discovery"
            description: "Find the correct function or type and real examples of using it in this repository."
          - name: "Configuration precedence tracing"
            description: "Explain how defaults, environment variables, neo.json, and generated configuration determine behavior."
          - name: "Generated artifact provenance"
            description: "Identify which source, generator, inputs, and build step produced a file or embedded artifact."
      - name: "Historical investigation"
        description: "Explain how and why the current implementation came to exist."
        children:
          - name: "Feature origin"
            description: "Trace a feature to introducing commits, pull requests, design records, and earlier implementations."
          - name: "Decision rationale"
            description: "Recover why a design or constraint was chosen and which alternatives were rejected."
          - name: "Behavioral evolution"
            description: "Compare revisions to explain when an API, default, or observable behavior changed."
          - name: "Regression bisection"
            description: "Identify the first revision that introduced a reproducible failure."
      - name: "Impact and dependency analysis"
        description: "Determine what a proposed change would affect before making it."
        children:
          - name: "Caller and consumer analysis"
            description: "Find direct users, generated-project consumers, integrations, and transitive dependencies of an API."
          - name: "Contract and invariant discovery"
            description: "Identify assumptions about event ordering, tenancy, errors, schemas, and persisted data."
          - name: "Test and evidence mapping"
            description: "Find which tests or checks support a claim and where evidence is missing."
  - name: "Plan and design"
    description: "Turn an idea or problem into an assessable technical proposal."
    children:
      - name: "Requirements discovery"
        description: "Define the intended outcome and its observable boundaries."
        children:
          - name: "Request clarification"
            description: "Resolve ambiguous behavior, actors, inputs, constraints, and exclusions."
          - name: "Acceptance criteria"
            description: "Translate desired outcomes into concrete examples, failure cases, and boundaries."
          - name: "Domain and event modeling"
            description: "Define entities, commands, events, queries, integrations, and their relationships for a use case."
          - name: "Compatibility requirements"
            description: "Specify which consumers, event histories, generated projects, and platforms must keep working."
      - name: "Architecture and API design"
        description: "Choose the structure and contracts of a proposed capability."
        children:
          - name: "Public API design"
            description: "Design types, signatures, error values, defaults, and naming for a newcomer-facing interface."
          - name: "Persistence and consistency design"
            description: "Choose event storage, projection, checkpoint, snapshot, and concurrency semantics."
          - name: "Protocol and schema design"
            description: "Define HTTP, MCP, CLI, JSON-RPC, JSON Schema, or OpenAPI contracts."
          - name: "Cross-component design"
            description: "Coordinate a change spanning Haskell APIs, Rust tooling, the starter, and browser IDE."
      - name: "Feasibility and delivery planning"
        description: "Establish whether an approach works and how to deliver it."
        children:
          - name: "Technical spike"
            description: "Build a bounded experiment to resolve a specific implementation uncertainty."
          - name: "Alternative comparison"
            description: "Compare libraries, backends, algorithms, or designs against explicit requirements."
          - name: "Work decomposition"
            description: "Break a proposal into independently reviewable tasks and identify ordering dependencies."
          - name: "Migration and rollout planning"
            description: "Plan compatibility periods, conversions, release sequencing, and rollback conditions."
  - name: "Implement and extend capabilities"
    description: "Add or deliberately change product behavior; use diagnostic categories when the primary request is to repair a defect."
    children:
      - name: "Standard library and language facilities"
        description: "Extend the Haskell vocabulary available to application authors."
        children:
          - name: "Values and collections"
            description: "Add operations for text, bytes, arrays, maps, sets, optional values, identifiers, dates, and numbers."
          - name: "Effects and concurrency"
            description: "Extend Task, asynchronous work, streams, channels, locks, and shared mutable state."
          - name: "System and network access"
            description: "Extend filesystem, paths, environment, subprocess, clock, and outbound HTTP facilities."
          - name: "Serialization and schemas"
            description: "Add JSON encoding, decoding, type-derived schemas, and OpenAPI generation behavior."
          - name: "Parsing and language tooling"
            description: "Extend parser combinators, NeoQL, syntax handling, layout rendering, and command-line parsing."
          - name: "Traits and derivation"
            description: "Extend shared abstractions, instances, Template Haskell derivation, and compile-time diagnostics."
      - name: "Event-sourced application framework"
        description: "Extend the runtime used to build services."
        children:
          - name: "Command decisions and execution"
            description: "Add validation, decision semantics, rejection behavior, command dispatch, and concurrency retries."
          - name: "Event storage and subscriptions"
            description: "Extend append semantics, stream reads, storage backends, notifications, and subscriptions."
          - name: "Entity reconstruction and snapshots"
            description: "Extend state folding, entity fetching, snapshot caching, and cache invalidation."
          - name: "Queries and projections"
            description: "Extend read models, pagination, query storage, rebuilds, and persistent checkpoints."
          - name: "Application lifecycle and wiring"
            description: "Extend service composition, startup, shutdown, readiness, and resource configuration."
          - name: "Inbound and outbound orchestration"
            description: "Extend event-triggered work, inbound commands, timers, dispatchers, and integration lifecycle."
      - name: "Service boundaries"
        description: "Extend capabilities exposed to applications and external clients."
        children:
          - name: "HTTP and static serving"
            description: "Add routes, request decoding, response behavior, CORS, static assets, and SPA serving."
          - name: "MCP and CLI transports"
            description: "Add tool-facing or terminal-facing access to service commands and queries."
          - name: "Identity and access control"
            description: "Extend OAuth providers, JWT authentication, command permissions, query visibility, and tenant context."
          - name: "Typed configuration"
            description: "Extend configuration declarations, validation, environment sourcing, and secret handling."
          - name: "File and blob lifecycle"
            description: "Extend upload, download, deduplication, metadata storage, and blob backend behavior."
      - name: "External service adapters"
        description: "Add or extend connections to third-party systems."
        children:
          - name: "Provider onboarding"
            description: "Implement a new adapter with request and response types, configuration, authentication, and tests."
          - name: "Provider capability expansion"
            description: "Extend existing email, LLM, OCR, PDF, audio, Azure, or Oura adapters."
          - name: "Provider protocol adaptation"
            description: "Accommodate changed payloads, endpoints, streaming formats, or authentication requirements."
          - name: "Shared adapter behavior"
            description: "Extend common HTTP authentication, secret interpolation, retries, errors, and fake providers."
      - name: "Reference applications"
        description: "Demonstrate framework behavior in executable examples."
        children:
          - name: "New example scenario"
            description: "Add a testbed domain or scenario illustrating a framework capability."
          - name: "Existing example evolution"
            description: "Update Cart, Stock, Document, or other examples when framework behavior changes."
          - name: "Executable tutorial slice"
            description: "Produce a small application slice with domain code, wiring, and an end-to-end demonstration."
  - name: "CLI and project generation"
    description: "Change how developers create, inspect, build, and manage NeoHaskell projects."
    children:
      - name: "Command behavior"
        description: "Extend the Rust CLI's user-visible operations."
        children:
          - name: "Command and flag design"
            description: "Add or revise subcommands, arguments, defaults, help text, and exit codes."
          - name: "Interactive terminal experience"
            description: "Improve prompts, progress, watch views, cancellation, and terminal rendering."
          - name: "Automation and machine output"
            description: "Improve noninteractive execution, structured output, deterministic behavior, and scriptability."
          - name: "Actionable diagnostics"
            description: "Translate failures from Nix, Cabal, Git, GHCi, and Hurl into concrete repair instructions."
      - name: "Project scaffolding and reconciliation"
        description: "Manage templates and configuration emitted into generated projects."
        children:
          - name: "Starter template evolution"
            description: "Change generated application or library layouts, examples, defaults, and bundled development files."
          - name: "Configuration reconciliation"
            description: "Convert neo.json into coherent Nix, Cabal, and module registration files."
          - name: "Dependency specification and resolution"
            description: "Extend dependency syntax, registry lookup, local references, and immutable pins."
          - name: "Generated-project compatibility"
            description: "Keep the bundled starter buildable against its pinned framework and intended upstream changes."
      - name: "Developer command orchestration"
        description: "Manage the external processes and project information behind CLI commands."
        children:
          - name: "Build run and test orchestration"
            description: "Coordinate subprocesses, status propagation, cleanup, and failure reporting."
          - name: "Watch and reload behavior"
            description: "Improve change detection, rebuild scheduling, process restart, and feedback latency."
          - name: "Domain inspection"
            description: "Discover commands, events, queries, integrations, and wiring from application source."
          - name: "Domain file protection"
            description: "Extend file locking, modification detection, and associated Git hooks."
          - name: "Agent tool setup"
            description: "Improve installation and updating of shared resources into supported AI coding tools."
  - name: "Browser IDE and interaction design"
    description: "Change the bundled React IDE and its Rust server as an interactive product."
    children:
      - name: "Event-model authoring"
        description: "Improve how users create and navigate an event model."
        children:
          - name: "Graph editing"
            description: "Add or improve node creation, connection rules, labels, selection, and editing operations."
          - name: "Diagram layout"
            description: "Improve swimlanes, slices, bands, routing, automatic placement, and preservation of manual positions."
          - name: "Navigation and semantic zoom"
            description: "Improve feature pages, submodels, command palettes, viewport control, and detail at different zoom levels."
          - name: "New workspace views"
            description: "Design and implement additional views; establish scope for currently placeholder lenses before treating them as available."
      - name: "Model persistence and synchronization"
        description: "Keep browser state, disk models, and inspected source coherent."
        children:
          - name: "Import export and serialization"
            description: "Improve model file formats, round trips, downloads, and malformed-file handling."
          - name: "Autosave and recovery"
            description: "Improve dirty-state tracking, local persistence, interrupted writes, and recovery after reload."
          - name: "Source-to-model synchronization"
            description: "Reconcile source changes into model fields and structure while respecting layout behavior."
          - name: "Validation and model repair"
            description: "Improve schema checks, referential integrity, problems presentation, healing, and cancellation."
          - name: "Concurrent edit handling"
            description: "Address races among autosave, filesystem watchers, source synchronization, and repair operations."
      - name: "Frontend and backend communication"
        description: "Maintain the IDE's runtime connection to the local server."
        children:
          - name: "RPC contract evolution"
            description: "Add or revise JSON-RPC methods, payloads, capabilities, and error responses."
          - name: "Connection lifecycle"
            description: "Improve initialization, WebSocket reconnection, disconnect states, and version mismatches."
          - name: "Workspace server behavior"
            description: "Extend host and port handling, workspace access, server lifecycle, and embedded asset serving."
      - name: "Usability and visual quality"
        description: "Make the interface understandable and operable for its users."
        children:
          - name: "Interaction and information design"
            description: "Improve navigation, discoverability, onboarding, empty states, and feedback."
          - name: "Accessibility"
            description: "Improve keyboard access, focus, labels, contrast, motion, and assistive-technology support."
          - name: "Visual consistency and responsiveness"
            description: "Refine typography, spacing, colors, node styles, themes, and behavior at different viewport sizes."
  - name: "Diagnose and repair defects"
    description: "Restore intended behavior through reproduction, root-cause analysis, and a targeted correction."
    children:
      - name: "Reproduction and triage"
        description: "Turn a reported symptom into a bounded, evidence-backed defect."
        children:
          - name: "Minimal reproducer"
            description: "Reduce a failure to the smallest application, input, event sequence, or command that demonstrates it."
          - name: "Environment comparison"
            description: "Explain why behavior differs locally, in CI, across machines, or between clean and warm environments."
          - name: "Intermittent failure investigation"
            description: "Capture timing, seeds, contention, or ordering behind a failure that does not reproduce reliably."
          - name: "Expected-behavior determination"
            description: "Determine whether a report describes a defect, intentional behavior, missing feature, or misleading documentation."
      - name: "Build and startup defects"
        description: "Repair failures before a usable application or tool is available."
        children:
          - name: "Compilation and type errors"
            description: "Fix Haskell, Rust, or TypeScript compilation, derivation, import, or interface failures."
          - name: "Dependency and linker failures"
            description: "Repair package resolution, native library linking, incompatible toolchains, and stale artifacts."
          - name: "Configuration and startup failures"
            description: "Fix invalid defaults, environment parsing, missing resources, boot order, and readiness failures."
          - name: "Installation and platform failures"
            description: "Repair architecture detection, permissions, executable discovery, and platform-specific installation errors."
      - name: "Runtime correctness defects"
        description: "Repair incorrect results or failed operations during use."
        children:
          - name: "Business-rule and state-transition defects"
            description: "Correct accepted or rejected commands, emitted events, and reconstructed state."
          - name: "Persistence and projection defects"
            description: "Correct missing, duplicated, stale, misordered, or incorrectly scoped stored and projected data."
          - name: "Concurrency and lifecycle defects"
            description: "Repair races, deadlocks, retry errors, resource leaks, cancellation, and worker recovery."
          - name: "Protocol and integration defects"
            description: "Repair malformed requests, incompatible responses, authentication flows, and external service handling."
          - name: "CLI and IDE behavior defects"
            description: "Repair command output, generated files, browser interactions, model sync, and frontend/backend mismatches."
  - name: "Review and audit"
    description: "Assess an existing change or system and report findings; remediation can become a separate implementation task."
    children:
      - name: "Change review"
        description: "Judge a proposed diff against its intended behavior and surrounding contracts."
        children:
          - name: "Correctness review"
            description: "Find logic errors, missing edge cases, and violations of domain or runtime invariants."
          - name: "Design and maintainability review"
            description: "Assess abstraction boundaries, coupling, complexity, naming, and extensibility."
          - name: "Test adequacy review"
            description: "Assess whether tests can detect realistic failures and exercise the promised boundaries."
          - name: "Compatibility review"
            description: "Identify breaking API, schema, configuration, CLI, event-history, or generated-project changes."
      - name: "Security assessment"
        description: "Analyze threats and weaknesses in this repository's trust boundaries."
        children:
          - name: "Threat modeling"
            description: "Identify assets, attackers, entry points, trust boundaries, and abuse cases for a proposed or existing feature."
          - name: "Authentication and authorization audit"
            description: "Inspect OAuth, JWT verification, permission checks, tenant isolation, and query visibility."
          - name: "Input and boundary audit"
            description: "Examine HTTP, MCP, JSON-RPC, file paths, uploads, URLs, and subprocess inputs for unsafe handling."
          - name: "Secrets and sensitive-data audit"
            description: "Inspect configuration, logs, errors, artifacts, and repository history for unintended disclosure."
          - name: "Supply-chain and automation audit"
            description: "Inspect dependency provenance, downloads, checksums, workflow permissions, action pins, and cache trust."
          - name: "Resource-abuse audit"
            description: "Assess request limits, rate limits, retry amplification, expensive operations, and denial-of-service exposure."
      - name: "Repository health assessment"
        description: "Identify broader risks and accumulated inconsistencies."
        children:
          - name: "Architecture conformance"
            description: "Compare actual dependencies and responsibilities with intended layering and design decisions."
          - name: "Staleness and dead-code audit"
            description: "Find obsolete modules, unused dependencies, misleading docs, and abandoned configuration."
          - name: "Licensing and provenance review"
            description: "Inventory licenses, notices, imported code provenance, and distribution obligations for human review."
          - name: "Release readiness review"
            description: "Assess evidence that packaged components, migrations, compatibility metadata, and documentation are ready."
  - name: "Testing and verification"
    description: "Create or improve evidence of behavior, independently of adding a product feature."
    children:
      - name: "Behavioral test development"
        description: "Cover the intended semantics at the appropriate boundary."
        children:
          - name: "Unit and property tests"
            description: "Verify local functions, invariants, algebraic properties, round trips, and boundary inputs."
          - name: "Regression tests"
            description: "Encode a known failure so the same defect is detected if it returns."
          - name: "Compile-time tests"
            description: "Verify type errors, derivation diagnostics, and invalid programs rejected during compilation."
          - name: "Backend contract tests"
            description: "Run shared semantics against in-memory and PostgreSQL implementations."
          - name: "API and application acceptance tests"
            description: "Exercise real service behavior through Hurl, application scenarios, or external protocols."
          - name: "CLI and generated-project tests"
            description: "Verify commands and prove that newly generated projects build, run, and test successfully."
          - name: "Browser and interaction tests"
            description: "Verify components, graph operations, persistence, accessibility, and end-to-end browser workflows."
      - name: "Adversarial and resilience verification"
        description: "Test how the system behaves under exceptional conditions."
        children:
          - name: "Fuzz and malformed-input tests"
            description: "Probe parsers, decoders, model validators, and protocol boundaries with unexpected input."
          - name: "Concurrency and ordering tests"
            description: "Exercise conflicting writes, duplicate delivery, subscription races, and cancellation timing."
          - name: "Fault-injection tests"
            description: "Simulate network failures, database disconnects, worker crashes, partial writes, and provider errors."
          - name: "Migration and replay tests"
            description: "Verify old events, models, configuration, and generated projects remain usable after a change."
      - name: "Test infrastructure"
        description: "Make verification reliable, representative, and practical to run."
        children:
          - name: "Fixtures fakes and builders"
            description: "Create reusable scenarios, isolated databases, provider fakes, and test data builders."
          - name: "Test discovery and selection"
            description: "Fix missing registrations, selectors that run nothing, and incorrect test-impact routing."
          - name: "Flaky-test repair"
            description: "Remove uncontrolled timing, shared state, environmental coupling, and nondeterministic assertions."
          - name: "Test-suite effectiveness"
            description: "Find redundant coverage, slow setup, weak assertions, and gaps using coverage or mutation evidence."
  - name: "Performance and scalability"
    description: "Measure and improve resource use without silently changing correctness."
    children:
      - name: "Measurement and diagnosis"
        description: "Establish workloads, baselines, and the location of a bottleneck."
        children:
          - name: "Benchmark design"
            description: "Define representative workloads for primitives, event processing, projections, or developer commands."
          - name: "CPU memory and allocation profiling"
            description: "Locate hot paths, excessive allocation, retained objects, and garbage-collection pressure."
          - name: "Database and I/O analysis"
            description: "Measure query plans, pool contention, connection counts, filesystem work, and network waits."
          - name: "Regression attribution"
            description: "Compare revisions and environments to explain a measurable slowdown."
      - name: "Runtime optimization"
        description: "Improve throughput, latency, and resource consumption in application execution."
        children:
          - name: "Event and projection throughput"
            description: "Optimize append, subscription delivery, projection updates, replay, and rebuild behavior."
          - name: "Startup and readiness latency"
            description: "Reduce work on cold start and health checks while preserving meaningful readiness signals."
          - name: "Concurrency and resource budgets"
            description: "Tune pools, queues, worker counts, batching, backpressure, and retry behavior."
          - name: "Data structure and serialization costs"
            description: "Improve collection algorithms, encoding, decoding, caching, and repeated computation."
      - name: "Developer experience performance"
        description: "Reduce waiting and resource use in tools used by contributors and application authors."
        children:
          - name: "Build and feedback latency"
            description: "Improve incremental compilation, watch reloads, dependency caching, and test startup."
          - name: "Clean-machine onboarding time"
            description: "Reduce download and first-build costs and verify cache substitution for generated projects."
          - name: "IDE rendering and model scale"
            description: "Improve layout, rendering, graph operations, and synchronization for large models."
  - name: "Refactor and maintain"
    description: "Improve internal structure or remove maintenance burden while preserving declared behavior."
    children:
      - name: "Structural refactoring"
        description: "Reshape code without intentionally changing its public contract."
        children:
          - name: "Module and responsibility boundaries"
            description: "Split large modules, move responsibilities, and reduce cross-layer dependencies."
          - name: "Shared implementation extraction"
            description: "Consolidate duplicated logic across backends, commands, integrations, or frontend components."
          - name: "Type and error-model simplification"
            description: "Make invalid states harder to express and errors easier to propagate consistently."
          - name: "Control-flow and naming cleanup"
            description: "Improve readability, function scope, naming, and orchestration structure."
      - name: "Dependency and toolchain maintenance"
        description: "Keep the software stack compatible and reproducible."
        children:
          - name: "Dependency upgrades"
            description: "Update Haskell, Rust, JavaScript, GitHub Action, or Nix dependencies and resolve breakage."
          - name: "Compiler and runtime upgrades"
            description: "Adapt to new GHC, Rust, Node, TypeScript, or platform toolchains."
          - name: "Dependency reduction"
            description: "Remove unused packages, replace unnecessary abstractions, and reduce transitive dependencies."
          - name: "Lockfile and pin reconciliation"
            description: "Repair drift among lockfiles, source revisions, generated configuration, and release compatibility data."
      - name: "Retirement and repository cleanup"
        description: "Remove obsolete surfaces and preserve useful history or migration guidance."
        children:
          - name: "Feature deprecation and removal"
            description: "Retire APIs, commands, formats, or integrations with an explicit consumer transition."
          - name: "Dead code and artifact cleanup"
            description: "Remove unreachable code, stale fixtures, obsolete generated artifacts, and unused configuration."
          - name: "Package extraction or consolidation"
            description: "Move components into or out of the monorepo and repair ownership, imports, and build wiring."
  - name: "Data compatibility and recovery"
    description: "Preserve or restore meaning across persisted state and version changes."
    children:
      - name: "Format and schema evolution"
        description: "Change durable representations with explicit compatibility handling."
        children:
          - name: "Event evolution"
            description: "Introduce new event shapes, decoding compatibility, or upcasting without corrupting historical meaning."
          - name: "Database schema migration"
            description: "Evolve event, query, checkpoint, and file-state tables with reversible or recoverable transitions."
          - name: "Model and configuration migration"
            description: "Convert event-model.json, neo.json, or other persisted developer-facing formats."
          - name: "API serialization compatibility"
            description: "Preserve or deliberately migrate external JSON fields, schema names, and wire representations."
      - name: "State repair and reconstruction"
        description: "Restore derived or damaged state from trustworthy inputs."
        children:
          - name: "Projection rebuild"
            description: "Reconstruct read models from the event log and verify completeness and checkpoint correctness."
          - name: "Snapshot and cache recovery"
            description: "Invalidate or reconstruct stale snapshots and caches without losing authoritative data."
          - name: "Integrity diagnosis and repair"
            description: "Detect inconsistent references, stream positions, tenant scopes, blob metadata, or duplicate records."
          - name: "Backup restore and replay rehearsal"
            description: "Design or verify recovery procedures using isolated data and explicit integrity checks."
  - name: "Build environment and CI"
    description: "Make development and automated verification reproducible across supported environments."
    children:
      - name: "Local environment management"
        description: "Set up and repair the prerequisites needed to work on the repository."
        children:
          - name: "Toolchain provisioning"
            description: "Configure Nix shells, compilers, native libraries, and cloud development setup."
          - name: "Local service setup"
            description: "Start and configure PostgreSQL or other test prerequisites and diagnose connectivity issues."
          - name: "Workspace and cache repair"
            description: "Resolve stale build outputs, branch-switch artifacts, disk pressure, and inconsistent caches."
          - name: "Cross-platform support"
            description: "Address Linux, macOS, CPU architecture, filesystem, and shell differences."
      - name: "Build and packaging mechanics"
        description: "Produce the correct binaries, libraries, and bundled assets."
        children:
          - name: "Haskell and Rust build wiring"
            description: "Maintain Cabal packages, Cargo crates, Nix derivations, build inputs, and package outputs."
          - name: "Frontend bundling and embedding"
            description: "Keep TypeScript builds and committed IDE assets coherent with the Rust binary that embeds them."
          - name: "Reproducibility checks"
            description: "Detect unpinned inputs, network-dependent generation, and differences between clean builds."
          - name: "Binary cache operation"
            description: "Populate and diagnose Cachix or other caches and verify the intended consumers can use them."
      - name: "CI workflow engineering"
        description: "Ensure automation runs the right checks and reports meaningful results."
        children:
          - name: "Trigger and change-routing repair"
            description: "Fix missing jobs, path filters, stacked-branch handling, and draft or promotion behavior."
          - name: "Job matrix and dependency design"
            description: "Arrange platform coverage, job ordering, parallelism, cancellation, and failure propagation."
          - name: "CI failure diagnosis"
            description: "Diagnose runner-only failures, missing prerequisites, cache problems, timeouts, and permissions."
          - name: "Gate effectiveness"
            description: "Detect skipped checks, false-green outcomes, nonexecuted tests, and missing required-status coverage."
          - name: "CI cost and duration"
            description: "Reduce redundant work, artifact transfer, repeated setup, and excessive runner consumption."
  - name: "Release and distribution"
    description: "Prepare and deliver coherent versions of the platform and its installable artifacts."
    children:
      - name: "Release preparation"
        description: "Assemble the source and human-facing information for a release."
        children:
          - name: "Version coordination"
            description: "Keep Haskell packages, integrations, Neo CLI, starter pins, tags, and compatibility metadata coherent."
          - name: "Release notes and migrations"
            description: "Describe shipped outcomes, breaking changes, upgrade steps, and agent-assisted migration instructions."
          - name: "Artifact verification"
            description: "Verify binaries, embedded assets, checksums, manifests, provenance, and platform coverage."
      - name: "Publication and installation"
        description: "Deliver artifacts that users can discover, install, and execute."
        children:
          - name: "Release automation"
            description: "Maintain release creation, tagging, artifact upload, retries, and recovery from partial publication."
          - name: "Installer and bootstrap compatibility"
            description: "Maintain platform detection, download selection, verification, and install behavior where still supported."
          - name: "Published consumer validation"
            description: "Verify a clean machine can use the released CLI and build its generated project from published inputs."
      - name: "Rollback and post-release response"
        description: "Address regressions discovered after distribution."
        children:
          - name: "Release regression triage"
            description: "Determine affected versions, platforms, consumers, and whether rollback or a forward fix is appropriate."
          - name: "Revert and corrective release"
            description: "Prepare targeted reverts, repaired artifacts, or a new release with clear compatibility consequences."
          - name: "Publication recovery"
            description: "Repair missing assets, inconsistent tags, incorrect metadata, or interrupted automation."
  - name: "Operations and observability"
    description: "Understand and improve behavior while applications or development services are running."
    children:
      - name: "Runtime visibility"
        description: "Expose enough evidence to diagnose real execution."
        children:
          - name: "Structured logging and diagnostics"
            description: "Improve contextual logs, error classification, redaction, and correlation across asynchronous work."
          - name: "Health and readiness signals"
            description: "Distinguish process availability from database, worker, subscription, and application readiness."
          - name: "Metrics and tracing"
            description: "Add or design latency, throughput, queue, connection, and request-flow instrumentation."
      - name: "Reliability and incident work"
        description: "Restore service and reduce recurrence of operational failures."
        children:
          - name: "Live symptom investigation"
            description: "Diagnose stalled projections, failed requests, disconnected listeners, and worker failures using runtime evidence."
          - name: "Recovery behavior"
            description: "Improve reconnect, catch-up, restart, shutdown, retry, and resource cleanup behavior."
          - name: "Capacity and configuration tuning"
            description: "Tune database connections, worker budgets, limits, and timeouts against measured demand."
          - name: "Incident reconstruction"
            description: "Build an evidence-backed timeline, root-cause explanation, and preventive follow-up tasks."
  - name: "Documentation and knowledge transfer"
    description: "Help humans and agents understand and use the project accurately."
    children:
      - name: "User-facing explanation"
        description: "Teach the framework and tooling through concrete, accurate material."
        children:
          - name: "Tutorials and onboarding"
            description: "Explain installation, the first application, common workflows, and how to interpret failures."
          - name: "API reference and examples"
            description: "Document types, contracts, examples, defaults, and limitations with verifiable code references."
          - name: "Concept and architecture explanation"
            description: "Explain event sourcing, CQRS, domain modeling, package boundaries, and framework execution."
          - name: "Troubleshooting guidance"
            description: "Turn recurring failures into symptoms, causes, diagnosis steps, and repair instructions."
      - name: "Maintainer knowledge"
        description: "Preserve the reasoning and practical knowledge behind the implementation."
        children:
          - name: "Decision records"
            description: "Record technical choices, constraints, tradeoffs, and consequences."
          - name: "Diagrams and repository maps"
            description: "Create dependency maps, sequence diagrams, domain diagrams, and task taxonomies."
          - name: "Contribution and operations guides"
            description: "Explain building, testing, reviewing, releasing, and recovering the project."
          - name: "Handoffs and technical briefings"
            description: "Summarize findings, completed work, open questions, and evidence for another person or agent."
      - name: "Documentation integrity"
        description: "Keep written claims and generated references synchronized with reality."
        children:
          - name: "Stale or contradictory content repair"
            description: "Reconcile documentation with current code, behavior, and ownership."
          - name: "Generated reference maintenance"
            description: "Repair generators and synchronization for API listings, schema documents, and derived indexes."
          - name: "External documentation coordination"
            description: "Prepare source-backed changes or handoffs for the website repository rather than assuming its pages live here."
  - name: "Agent and contributor tooling"
    description: "Improve the machinery that helps humans and AI agents work effectively in this repository."
    children:
      - name: "Code discovery tools"
        description: "Improve access to accurate repository knowledge."
        children:
          - name: "Symbol and API search"
            description: "Improve type-directed lookup, symbol references, caller analysis, and index freshness."
          - name: "Capability and ownership maps"
            description: "Maintain mappings from user vocabulary to components and extension locations."
          - name: "Task classification and routing"
            description: "Build or evaluate taxonomies that distinguish user intent, scope, and the appropriate working context."
      - name: "Automated assistance"
        description: "Improve local tools that guide or carry out contributor work."
        children:
          - name: "Editor hooks and formatting"
            description: "Improve edit-time formatting, diagnostics, integration hooks, and failure handling."
          - name: "Static guards and lint rules"
            description: "Add or repair syntax checks, policy checks, false-positive handling, and rule diagnostics."
          - name: "Agent instructions and reusable resources"
            description: "Author or assess instruction files and reusable task resources when explicitly requested."
          - name: "Developer command interfaces"
            description: "Improve development scripts, command discoverability, output clarity, and self-diagnostics."
      - name: "Workflow quality and learning"
        description: "Assess and improve how work is executed and measured."
        children:
          - name: "Workflow automation maintenance"
            description: "Repair task state, evidence collection, review records, and resumability machinery as software."
          - name: "Tool and agent evaluation"
            description: "Measure whether routing, instructions, or automation reliably achieve their intended outcomes."
          - name: "Telemetry and retrospective analysis"
            description: "Analyze execution records for recurring failures, wasted effort, and actionable improvements."
